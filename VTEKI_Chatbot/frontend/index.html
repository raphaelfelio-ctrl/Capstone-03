  <style>
    :root {

    html,

    button,
    input,
    select,
    textarea {

    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .brand-name,
    .sectiontitle,
    .pagehead h1,
    .dialoghead h2 {
      font-family: "Poppins", "Montserrat", system-ui, -apple-system, sans-serif !important;
    }

    /* Animasi halus antarmuka (calm & purposeful) */
    .content {
      animation: pageFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-brand,
    .loginpanel {
      animation: pageFadeIn 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar {
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item,
    .btn,
    .icon-btn {
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    /* Logo di bagian atas dan rapi pada login */
    .login-brand {
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
    }

    .login-brand .login-brand-logo {
      display: flex !important;
      align-items: center !important;
      gap: var(--s3) !important;
      margin-top: 0 !important;
      margin-bottom: auto !important;
      align-self: flex-start !important;
    }

    /* Slider berjalan di bagian login */
    .login-slider {
      position: relative !important;
      width: 100% !important;
      max-width: 580px !important;
      min-height: 290px !important;
      margin: auto auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .login-slide {
      position: absolute !important;
      inset: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      opacity: 0 !important;
      transform: translateY(14px) scale(.98) !important;
      transition: opacity .5s cubic-bezier(.16, 1, .3, 1), transform .5s cubic-bezier(.16, 1, .3, 1) !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    .login-slide.active {
      position: relative !important;
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
      pointer-events: auto !important;
      visibility: visible !important;
    }

    .slide-badge {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      padding: 5px 12px !important;
      border-radius: var(--r-pill) !important;
      background: rgba(169, 208, 235, .14) !important;
      border: 1px solid rgba(169, 208, 235, .28) !important;
      color: #A9D0EB !important;
      font-size: var(--fs-xs) !important;
      font-weight: 600 !important;
      letter-spacing: .04em !important;
      text-transform: uppercase !important;
      margin-bottom: var(--s3) !important;
      font-family: var(--font-heading) !important;
    }

    .login-slide h1 {
      font-family: var(--font-heading) !important;
      font-size: clamp(28px, 3.2vw, 42px) !important;
      line-height: 1.22 !important;
      letter-spacing: -.02em !important;
      color: #fff !important;
      margin: 0 auto var(--s4) !important;
      font-weight: 700 !important;
      text-align: center !important;
    }

    .login-slide h1 span {
      color: #A9D0EB !important;
    }

    .login-slide p {
      color: #D0DFEA !important;
      font-size: var(--fs-md) !important;
      line-height: 1.6 !important;
      max-width: 480px !important;
      margin: 0 auto !important;
      text-align: center !important;
    }

    .slider-dots {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
      margin: 0 auto !important;
      padding-top: var(--s4) !important;
      z-index: 2 !important;
    }

    .slider-dots .dot {
      width: 26px !important;
      height: 6px !important;
      border-radius: 999px !important;
      background: rgba(255, 255, 255, .24) !important;
      border: none !important;
      padding: 0 !important;
      cursor: pointer !important;
      transition: background-color .3s ease, width .3s ease !important;
    }

    .slider-dots .dot:hover {
      background: rgba(255, 255, 255, .45) !important;
    }

    .slider-dots .dot.active {
      width: 44px !important;
      background: #A9D0EB !important;
    }
  </style>

    /* ---------------- Chat ---------------- */

    function caseItem(c, admin) { const act = c.id === activeCase; return `<button type="button" class="caseitem ${act ? 'active' : ''}" ${act ? 'aria-current="true"' : ''} onclick="selectCase('${esc(c.id)}')" data-testid="case-item-${esc(c.id)}"><span class="case-id">${esc(c.id)}</span><span class="case-subj">${esc(c.subject || 'Percakapan baru')}</span><span class="case-tags">${statusTag(c.status)}${c.flagged ? '<span class="tag red">manipulasi</span>' : ''}${c.priority === 'Tinggi' ? '<span class="tag warn">Prioritas tinggi</span>' : ''}${admin && c.verified_level >= 2 ? `<span class="tag ${c.verified_level >= 3 ? 'blue' : 'green'}">AL${c.verified_level}</span>` : ''}</span>${admin ? `<span class="case-cust sub">${esc(c.customer_name || c.customer_email || '')} · ${esc(c.intent)}</span>` : ''}</button>` }
    function chatView(admin) {
      const title = admin ? 'Kasus & Percakapan' : 'Chat'; const desc = admin ? 'Pilih kasus untuk melihat riwayat, rute AI, dan membalas sebagai agen.' : 'Tanyakan informasi layanan. Jawaban AI hanya berdasarkan Basis Pengetahuan aktif.'; const cur = cases.find(c => c.id === activeCase); const wa = !admin && me.channel === 'whatsapp';
      const listTitle = admin ? 'Semua kasus' : 'Percakapan Anda';
      const left = `<aside class="panel case-list" id="caselist" aria-label="${listTitle}"><div class="case-list-head"><div class="row" style="align-items:center"><h2 class="sectiontitle" style="margin:0">${listTitle} <span class="count">${cases.length}</span></h2><button type="button" class="icon-btn case-toggle" onclick="toggleCaseList()" aria-label="Tutup daftar">${icon('x')}</button></div>${admin ? '' : btn(icon('plus', 'sm') + 'Percakapan baru', 'newCase()', 'btn secondary block')}</div><div class="case-list-body">${cases.map(c => caseItem(c, admin)).join('') || emptyState('Belum ada percakapan.', 'chat')}</div></aside>`;
      let banner = ''; if (!admin && me.ai_suspended) banner = `<div class="notice red" role="alert">${icon('alert', 'sm')}<span>Akses asisten AI pada akun Anda dinonaktifkan karena terdeteksi upaya manipulasi berulang. Pesan Anda tetap terkirim dan akan ditangani langsung oleh admin.</span></div>`; else if (!admin && me.guardrail_strikes > 0) banner = `<div class="notice" role="status">${icon('alert', 'sm')}<span>Peringatan keamanan: ${me.guardrail_strikes}/${maxStrikes}. Upaya memanipulasi asisten AI akan dialihkan ke admin dan dapat menonaktifkan akses AI Anda.</span></div>`; else if (!admin && cur?.ai_locked) banner = `<div class="notice info">${icon('users', 'sm')}<span>Percakapan ini sedang ditangani admin; asisten AI tidak menjawab di sini. Gunakan “Percakapan baru” untuk pertanyaan lain.</span></div>`;

  <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Riwayat pesan">${messages.map(m => bubble(m, admin)).join('') + pend + typing || emptyState('Mulai percakapan dengan mengirim pertanyaan.', 'chat')}</div>
  <div class="composer">${wa ? `<div class="wabar"><b style="display:flex;gap:6px;align-items:center">${icon('wa', 'sm')}Simulator WhatsApp · Asisten ${esc(ORG())}</b><span class="sub">${auth ? esc(auth.code) : ''}</span></div>` : ''}${!admin ? `<div class="quick" role="group" aria-label="Pertanyaan cepat">${quick.map(q => `<button type="button" onclick="quickSend('${esc(q)}')">${esc(q)}</button>`).join('')}</div>` : ''}${admin && cur ? `<div class="agent-tools">${btn(icon('sparkles', 'sm') + 'Draf Copilot', 'copilotDraft()', 'btn secondary small')}<label class="check" for="awaitcust"><input type="checkbox" id="awaitcust"> Setelah membalas, tunggu jawaban nasabah (SLA dijeda)</label>${copilotUsed ? '<span class="tag blue">draf Copilot dipakai</span>' : ''}</div>` : ''}
  <form class="sendrow" onsubmit="sendMessage(event)"><label for="message" class="sr-only">${admin ? 'Balasan agen' : 'Pesan'}</label><input id="message" class="field" placeholder="${admin ? 'Balas sebagai agen CS…' : 'Tulis pesan…'}" maxlength="4000" autocomplete="off" ${busy ? 'disabled' : ''} data-testid="message-input"><button type="submit" class="btn" ${busy ? 'disabled' : ''} data-testid="send-btn" aria-label="Kirim">${busy ? '<span class="spinner"></span><span class="btn-label">Memproses…</span>' : icon('send', 'sm') + '<span class="btn-label">Kirim</span>'}</button></form><div class="composer-hint">${icon('lock', 'sm')}Jangan kirim PIN, OTP, kata sandi, CVV, atau nomor kartu lengkap.</div></div></section>`;
      return pagehead(title, desc, '', 'hide-sm') + `<div class="chat-layout ${caseListOpen ? 'list-open' : ''}">${left}${right}</div>` + (admin && cur ? workspaceView(cur) : '') + (!admin && cur ? evidenceView(cur) : '')

    async function selectCase(id) { activeCase = id; caseListOpen = false; try { await loadTab(); render() } catch (e) { toast(e.message) } }
    async function newCase() { try { const d = await req('/cases', { method: 'POST', body: JSON.stringify({ subject: 'Percakapan baru' }) }); activeCase = d.case_id; messages = d.messages || []; cases = (await req('/cases')).items; caseListOpen = false; render() } catch (e) { toast(e.message) } }
    function quickSend(q) { $('#message').value = q; $('#message').focus() }
    function setWaitNote(t) { waitNote = t; const el = $('#waitnote'); if (el) el.textContent = t }
    function startWait() { stopWait(); waitTimers = [setTimeout(() => setWaitNote('Asisten sedang menyiapkan jawaban untuk Anda…'), 6000), setTimeout(() => setWaitNote('Jawaban butuh waktu lebih lama dari biasanya. Mohon tunggu sebentar, pesan Anda sudah kami terima.'), 20000)] }
    function stopWait() { waitTimers.forEach(clearTimeout); waitTimers = []; waitNote = '' }
    async function sendMessage(e) {
      e.preventDefault(); const input = $('#message'); const message = input.value.trim(); if (!message || busy) return; busy = true; pendingText = message; if (me.role !== 'admin') startWait(); render();
      try {
        if (me.role === 'admin') { if (!activeCase) throw new Error('Pilih kasus terlebih dahulu.'); await req('/admin/cases/' + encodeURIComponent(activeCase) + '/reply', { method: 'POST', body: JSON.stringify({ message, copilot_used: copilotUsed, awaiting_customer: !!$('#awaitcust')?.checked }) }); copilotUsed = false; toast('Balasan agen dikirim.'); await loadTab() }
        else {
          const cur = cases.find(c => c.id === activeCase); const caseId = cur && !['Selesai', 'Ditolak'].includes(cur.status) ? activeCase : null; const d = await req('/chat', { method: 'POST', body: JSON.stringify({ message, case_id: caseId }) }); activeCase = d.case_id; animateMsgId = d.message_id; if (d.reply_kind === 'account') ephemeral[d.message_id] = d.reply; if (auth) auth.level = d.auth_level; pendingAsk = d.auth_required && d.auth_level < d.auth_required ? { message, level: d.auth_required, case_id: d.case_id, resend: d.reply_kind === 'auth_required' } : null; me.guardrail_strikes = d.strikes; me.ai_suspended = d.ai_suspended ? 1 : 0; maxStrikes = d.max_strikes || maxStrikes;
          if (d.warning) toast(`Peringatan ${Math.min(d.strikes, d.max_strikes)}/${d.max_strikes}: percakapan dialihkan ke admin.`); else if (d.masked?.length) toast('Data rahasia dalam pesan Anda telah disamarkan.'); else if (pendingAsk) toast('Perlu verifikasi identitas AL' + pendingAsk.level + '.'); else if (d.handoff_id) toast('Dialihkan ke agen manusia (' + d.handoff_id + (d.ticket_id ? ' · ' + d.ticket_id : '') + ').'); else if (d.ticket_id) toast('Tiket ' + d.ticket_id + ' · ' + d.status); else if (d.clarify) toast('Mohon perjelas pertanyaan Anda.'); else toast('Pesan diproses · ' + d.status)
        }

      } catch (err) { toast(err.message) } finally { busy = false; pendingText = ''; stopWait(); render(); const inp = $('#message'); if (inp) inp.focus() }
    }
    async function unlockAI(id) { try { await req('/admin/cases/' + encodeURIComponent(id) + '/unlock-ai', { method: 'POST' }); toast('AI diaktifkan kembali untuk kasus ini.'); await loadTab(); render() } catch (e) { toast(e.message) } }

    function bindDrop() { const d = $('#drop'); if (!d) return;['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over') }));['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over') })); d.addEventListener('drop', e => pickFiles(e.dataTransfer.files)) }
    function pickFiles(list) { const ok = /\.(md|markdown|txt|pdf|docx)$/i; for (const f of list) { if (!ok.test(f.name)) { toast('Format ' + f.name + ' tidak didukung.'); continue } if (!pendingFiles.some(x => x.name === f.name && x.size === f.size)) pendingFiles.push(f) } uploadResults = []; render() }

      const rows = guard.items.map(g => `<tr><td data-label="Waktu" class="nowrap sub">${esc(fmtTime(g.created_at))}</td><td data-label="Customer">${esc(g.customer_name || '-')}<div class="sub">${esc(g.customer_email || '')}</div></td><td data-label="Kasus">${g.case_id ? `<button type="button" class="linkbtn" onclick="openCase('${esc(g.case_id)}')">${esc(g.case_id)}</button>` : '-'}</td><td data-label="Jenis">${stageTag[g.stage] || esc(g.stage)}<div class="sub">${esc((g.reason_labels || []).join(', '))}</div></td><td data-label="Pesan" class="msgcell">${esc(g.message.slice(0, 300))}</td><td data-label="Tindakan" class="sub">${esc(g.action)}</td><td data-label="Tinjauan">${g.reviewed ? `<span class="tag ${g.verdict === 'false_positive' ? 'gray' : g.verdict === 'info' ? 'blue' : 'green'}">${g.verdict === 'false_positive' ? 'salah deteksi' : g.verdict === 'info' ? 'info' : 'dikonfirmasi'}</span><div class="sub">${esc(g.reviewed_by || '')}</div>` : `<div class="actions">${btn('Konfirmasi', `reviewEvent(${g.id},'confirmed')`, 'btn small')}${['input', 'llm'].includes(g.stage) ? btn('Salah deteksi', `reviewEvent(${g.id},'false_positive')`, 'btn secondary small') : ''}</div>`}</td></tr>`).join('');
      return pagehead('Guardrail', 'Upaya memanipulasi AI otomatis dialihkan ke admin, customer diberi peringatan, dan setelah ' + guard.max_strikes + ' peringatan akses AI customer dinonaktifkan.') + `<div class="grid" style="margin-bottom:var(--s4)">${kpi('Total kejadian', guard.items.length, 'shieldAlert', 'red')}${kpi('Belum ditinjau', pending, 'clock', 'warn')}${kpi('Customer dengan peringatan', guard.users.length, 'users', 'blue')}${kpi('Batas peringatan', guard.max_strikes ?? '–', 'alert', 'gray')}</div>
  <section class="panel"><div class="panel-head"><h2 class="sectiontitle">${icon('list')}Kejadian <span class="count">${guard.items.length}</span></h2></div>${guard.items.length ? `<div class="tablewrap cards"><table class="dt"><thead><tr><th scope="col">Waktu</th><th scope="col">Customer</th><th scope="col">Kasus</th><th scope="col">Jenis</th><th scope="col">Pesan</th><th scope="col">Tindakan</th><th scope="col">Tinjauan</th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyState('Belum ada kejadian guardrail.', 'shieldCheck')}</section>
  <div class="grid2 even" style="margin-top:var(--s4)"><section class="panel"><h2 class="sectiontitle">${icon('users')}Customer dengan peringatan</h2>${users}</section><section class="panel" style="margin-top:0"><h2 class="sectiontitle">${icon('info')}Cara kerja</h2><ol class="how"><li>Pesan dinormalisasi (huruf dispasi, leetspeak, karakter tersembunyi) lalu dicek pola injeksi/jailbreak.</li><li>Gemini mengklasifikasi pesan; manipulasi halus (roleplay, klaim admin) ikut tertangkap.</li><li>Jika terdeteksi: AI berhenti, customer menerima peringatan, kasus dikunci & admin dinotifikasi.</li><li>Jawaban AI juga diperiksa: nomor/URL harus ada di knowledge, tidak boleh meminta OTP/PIN atau mengaku sudah memproses tindakan.</li></ol></section></div>`
    }
    async function reviewEvent(id, verdict) { if (verdict === 'false_positive' && !confirm('Tandai sebagai salah deteksi? Peringatan customer dikurangi dan AI pada kasus ini diaktifkan kembali.')) return; try { await req('/admin/guardrail/' + id + '/review', { method: 'POST', body: JSON.stringify({ verdict }) }); await loadTab(); render(); toast('Tinjauan tersimpan.') } catch (e) { toast(e.message) } }
    async function restoreAI(uid) { if (!confirm('Pulihkan akses AI dan reset peringatan customer ini?')) return; try { await req('/admin/users/' + uid + '/restore-ai', { method: 'POST' }); await loadTab(); render(); toast('Akses AI dipulihkan.') } catch (e) { toast(e.message) } }
    async function openCase(id) { activeCase = id; await go('cases') }

    /* ---------------- Lainnya ---------------- */
    function notificationsView() {
      const unread = notifications.filter(n => !n.is_read).length;
      return pagehead('Notifikasi', 'Pembaruan tiket dan tindak lanjut.', btn(icon('check', 'sm') + 'Tandai semua dibaca', 'readAll()', 'btn secondary')) + `<section class="panel list-flush" aria-label="Daftar notifikasi"><div class="panel-head" style="padding:var(--s4) var(--s5);margin:0;border-bottom:1px solid var(--border)"><h2 class="sectiontitle">${icon('bell')}Semua notifikasi <span class="count">${notifications.length}</span></h2><span class="tag ${unread ? 'warn' : 'gray'}">${unread} belum dibaca</span></div>${notifications.map(n => { const inner = `<span class="notif-dot" aria-hidden="true"></span><span class="notif-body"><b>${esc(n.message)}</b><span class="sub">${n.case_id ? esc(n.case_id) + ' · ' : ''}${esc(fmtTime(n.created_at))}</span></span><span class="tag ${n.is_read ? 'gray' : 'warn'}">${n.is_read ? 'Dibaca' : 'Baru'}</span>`; const cls = `notif ${n.is_read ? 'read' : 'unread'}`; return n.case_id ? `<button type="button" class="${cls}" onclick="${me.role === 'admin' ? `openCase('${esc(n.case_id)}')` : `activeCase='${esc(n.case_id)}';go('chat')`}">${inner}</button>` : `<div class="${cls}">${inner}</div>` }).join('') || emptyState('Belum ada notifikasi.', 'bell')}</section>`
    }
    async function readAll() { try { await req('/notifications/read-all', { method: 'POST' }); notifications = (await req('/notifications')).items; if (dashboard) dashboard.unread_notifications = 0; render() } catch (e) { toast(e.message) } }
    function approvalsView() { return pagehead('Persetujuan', 'Permintaan berisiko tinggi harus ditinjau manusia. Tidak ada transaksi nyata yang dijalankan.', `<span class="pill">${approvals.length} menunggu</span>`) + (approvals.map(a => { const ok = a.verified_level >= 3; return `<article class="approval" data-testid="approval-${esc(a.id)}"><div class="approval-head"><div><div class="case-id">${esc(a.id)}</div><h2 class="t-section">${esc(a.customer_name || a.customer_email)}</h2></div><div><span class="tag red">Menunggu persetujuan</span>${ok ? '<span class="tag blue">Identitas terverifikasi AL3</span>' : `<span class="tag warn">Belum AL3 (saat ini AL${a.verified_level || 1})</span>`}</div></div><div class="label" style="margin-bottom:6px">Permintaan</div><blockquote class="approval-quote">${esc(a.last_message || a.subject)}</blockquote>${ok ? '' : `<div class="notice">${icon('lock', 'sm')}<span>Persetujuan terkunci sampai customer menyelesaikan verifikasi AL3 (OTP + PIN transaksi). Anda tetap bisa menolak.</span></div>`}<div class="actions">${ok ? btn(icon('check', 'sm') + 'Setujui', `decide('${esc(a.id)}',true)`, 'btn success') : `<button type="button" class="btn success" disabled title="Customer belum AL3">${icon('lock', 'sm')}Setujui</button>`}${btn(icon('x', 'sm') + 'Tolak', `decide('${esc(a.id)}',false)`, 'btn danger-solid')}${btn(icon('chat', 'sm') + 'Buka percakapan', `openCase('${esc(a.id)}')`, 'btn secondary')}</div></article>` }).join('') || `<section class="panel">${emptyState('Tidak ada permintaan yang menunggu persetujuan.', 'checkCircle')}</section>`) }
    async function decide(id, approve) { if (!confirm((approve ? 'Setujui' : 'Tolak') + ' permintaan ' + id + '?')) return; try { await req('/admin/approvals/' + id, { method: 'POST', body: JSON.stringify({ approve }) }); approvals = (await req('/admin/approvals')).items; toast('Keputusan tersimpan.'); render() } catch (e) { toast(e.message) } }
    function auditView() { return pagehead('Audit Trail', 'Catatan aktivitas terbaru.') + `<section class="panel">${auditRows.length ? `<div class="tablewrap cards"><table class="dt"><thead><tr><th scope="col">Waktu</th><th scope="col">Pengguna</th><th scope="col">Aktivitas</th></tr></thead><tbody>${auditRows.map(a => `<tr><td data-label="Waktu" class="nowrap mono sub">${esc(fmtTime(a.created_at))}</td><td data-label="Pengguna">${esc(a.user_email)}</td><td data-label="Aktivitas">${esc(a.action)}</td></tr>`).join('')}</tbody></table></div>` : emptyState('Belum ada aktivitas.', 'history')}</section>` }
    (async function init() { if (!token) { render(); return } try { const d = await req('/auth/me'); me = d.user; maxStrikes = d.max_strikes || 3; auth = d.auth || null; window._org = d.org; tab = me.role === 'admin' ? 'dashboard' : 'chat'; await loadTab(); render() } catch { token = ''; localStorage.removeItem('vteki_token'); render() } })();
    document.getElementById('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg() });
  </script>
  <script src="ops.js"></script>
</body>

</html>
