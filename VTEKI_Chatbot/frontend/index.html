<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V-TEKI Workspace | Enterprise Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
   V-TEKI DESIGN SYSTEM (Inspired by v-teki.com Enterprise Brand Language)
   ========================================================================== */
    :root {
      --ink: #051C2C;
      /* Dark Navy Slate */
      --ink-surface: #0A2234;
      /* Lighter navy for sidebar active / elevated */
      --ink-border: rgba(255, 255, 255, 0.12);
      --accent: #2251FF;
      /* Electric Sapphire Blue */
      --accent-hover: #1742DD;
      --accent-light: #EEF3FF;
      --cream: #F5F2ED;
      /* Warm Editorial Neutral */
      --cream-soft: #FAF8F5;
      --bg-page: #F6F8FA;
      /* Crisp Enterprise Workspace Canvas */
      --panel: #FFFFFF;
      --line: #E2E8F0;
      /* Primary hairline border */
      --line-strong: #CBD5E1;
      --text: #051C2C;
      --text-secondary: #526574;
      --text-muted: #8496A6;
      --danger: #DC2626;
      --danger-light: #FEF2F2;
      --danger-border: #FECACA;
      --warn: #D97706;
      --warn-light: #FFFBEB;
      --warn-border: #FDE68A;
      --success: #059669;
      --success-light: #ECFDF5;
      --success-border: #A7F3D0;
      --font-serif: 'Bodoni Moda', Georgia, serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      --radius-xs: 3px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-subtle: 0 1px 2px rgba(5, 28, 44, 0.04), 0 1px 3px rgba(5, 28, 44, 0.02);
      --shadow-panel: 0 2px 8px rgba(5, 28, 44, 0.04), 0 1px 2px rgba(5, 28, 44, 0.02);
      --shadow-elevated: 0 12px 32px rgba(5, 28, 44, 0.12);
      --sidebar-w: 260px;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text);
      font: 14px/1.6 var(--font-sans);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    ::selection {
      background: var(--ink);
      color: #fff;
    }

    /* ==========================================================================
   App Shell & Modern Sidebar Layout
   ========================================================================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg-page);
    }

    /* Sidebar Component */
    .app-sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--ink);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      border-right: 1px solid var(--ink-surface);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-brand {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--ink-border);
    }

    .brand-card {
      background: #FFFFFF;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .brand-logo-img {
      max-width: 155px;
      max-height: 46px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .brand-badge-sub {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 0 2px;
    }

    .brand-badge-sub .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Sidebar Navigation Items */
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }

    .nav-section-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.45);
      margin: 14px 8px 6px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      margin: 2px 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }

    .nav-item.active {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.15s ease;
    }

    .nav-item:hover .nav-icon,
    .nav-item.active .nav-icon {
      color: #FFFFFF;
    }

    .nav-svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .inline-svg {
      width: 14px;
      height: 14px;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 5px;
      flex-shrink: 0;
    }

    .nav-badge {
      display: inline-block;
      min-width: 18px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    /* Sidebar User Footer */
    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--ink-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .sidebar-user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-xs);
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    .user-meta-name {
      font-weight: 600;
      font-size: 12.5px;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta-role {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Main Content Viewport */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }

    /* Topbar Header */
    .app-topbar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--line);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: var(--shadow-subtle);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-toggle-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      padding: 6px 10px;
      font-size: 16px;
      color: var(--ink);
    }

    .topbar-breadcrumbs {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-breadcrumbs .root {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .topbar-breadcrumbs .sep {
      color: var(--text-muted);
    }

    .topbar-breadcrumbs .current {
      font-weight: 700;
      color: var(--ink);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .org-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--cream-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }

    /* View Content Canvas */
    .app-content {
      flex: 1;
      padding: 24px 28px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* App Footer */
    .app-footer {
      padding: 16px 28px;
      border-top: 1px solid var(--line);
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ==========================================================================
   Page Headings & Cards
   ========================================================================== */
    .pagehead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin: 0 0 20px;
      flex-wrap: wrap;
    }

    .pagehead h1 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .pagehead p {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.4fr);
      gap: 16px;
    }

    .grid2.kb {
      grid-template-columns: minmax(320px, 0.8fr) minmax(0, 1.4fr);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px 22px;
      min-width: 0;
      box-shadow: var(--shadow-panel);
      transition: border-color 0.15s ease;
    }

    .panel:hover {
      border-color: var(--line-strong);
    }

    .panel+.panel {
      margin-top: 16px;
    }

    .metric {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 6px 0;
      color: var(--ink);
      line-height: 1.1;
    }

    .metriclabel {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sectiontitle {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin: 0 0 12px;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .muted {
      color: var(--text-secondary);
    }

    /* ==========================================================================
   Buttons & Interactive Affordances
   ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--ink);
      border-radius: var(--radius-xs);
      padding: 8px 16px;
      background: var(--ink);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.01em;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.secondary {
      background: #FFFFFF;
      color: var(--ink);
      border-color: var(--line-strong);
    }

    .btn.secondary:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.danger {
      background: var(--danger-light);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn.danger:hover {
      background: #FEE2E2;
      border-color: var(--danger);
    }

    .btn.small {
      padding: 5px 11px;
      font-size: 12px;
    }

    /* ==========================================================================
   Forms & Inputs
   ========================================================================== */
    .formrow {
      display: grid;
      gap: 5px;
      margin: 12px 0;
    }

    .formrow label {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
    }

    .field {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 9px 12px;
      color: var(--ink);
      outline: none;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .field::placeholder {
      color: var(--text-muted);
    }

    .field:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px rgba(5, 28, 44, 0.08);
    }

    textarea.field {
      resize: vertical;
      min-height: 100px;
    }

    /* ==========================================================================
   Chatbox & Interaction Views
   ========================================================================== */
    .chatbox {
      height: 65vh;
      min-height: 380px;
      max-height: 740px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 4px;
    }

    .bubble {
      max-width: 82%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      background: #FFFFFF;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.6;
    }

    .bubble.customer {
      align-self: flex-end;
      background: var(--ink);
      border-color: var(--ink);
      color: #FFFFFF;
    }

    .bubble.customer .sender {
      color: rgba(255, 255, 255, 0.65);
    }

    .bubble.agent {
      align-self: flex-start;
      background: #FFFFFF;
      border-color: var(--line-strong);
      border-left: 3px solid var(--accent);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--cream-soft);
      border-color: var(--line);
      border-left: 3px solid var(--ink);
    }

    .bubble.system {
      align-self: center;
      max-width: 90%;
      background: #FFFFFF;
      border: 1px dashed var(--line-strong);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .bubble.warning {
      align-self: center;
      max-width: 90%;
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }

    .bubble.flagged {
      border-color: var(--danger-border);
      background: var(--danger-light);
      color: var(--danger);
    }

    .sender {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .sources {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      white-space: normal;
    }

    .source {
      font-size: 11px;
      border: 1px solid var(--line-strong);
      background: #FFFFFF;
      color: var(--ink);
      border-radius: var(--radius-xs);
      padding: 3px 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .source:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .trace {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: normal;
      font-family: var(--font-mono);
      background: #FFFFFF;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
    }

    .sendrow {
      display: flex;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .sendrow input {
      flex: 1;
      min-width: 0;
    }

    .caseitem,
    .listitem {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      margin: 7px 0;
      background: #FFFFFF;
      transition: all 0.15s ease;
    }

    .caseitem {
      cursor: pointer;
    }

    .caseitem:hover,
    .listitem.clickable:hover {
      background: var(--cream-soft);
      border-color: var(--line-strong);
    }

    .caseitem.active,
    .listitem.active {
      background: #FFFFFF;
      border-color: var(--ink);
      border-left: 4px solid var(--ink);
      box-shadow: var(--shadow-subtle);
    }

    .listitem.clickable {
      cursor: pointer;
    }

    /* Tags & Badges */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-xs);
      background: var(--cream-soft);
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      margin: 2px 4px 2px 0;
      white-space: nowrap;
    }

    .tag.warn {
      background: var(--warn-light);
      color: var(--warn);
      border-color: var(--warn-border);
    }

    .tag.red {
      background: var(--danger-light);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .tag.green {
      background: var(--success-light);
      color: var(--success);
      border-color: var(--success-border);
    }

    .tag.gray {
      background: #F1F5F9;
      color: var(--text-secondary);
      border-color: #CBD5E1;
    }

    .tag.blue {
      background: var(--accent-light);
      color: var(--accent);
      border-color: #BFDBFE;
    }

    .tablewrap {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 580px;
    }

    td,
    th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 13px;
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--cream-soft);
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: var(--ink);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xs);
      max-width: 90vw;
      z-index: 100;
      box-shadow: var(--shadow-elevated);
      font-size: 13px;
      font-weight: 500;
    }

    .alpill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: var(--radius-xs);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--line-strong);
      background: #FFFFFF;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .alpill.l2 {
      background: var(--success-light);
      border-color: var(--success-border);
      color: var(--success);
    }

    .alpill.l3 {
      background: var(--accent-light);
      border-color: #BFDBFE;
      color: var(--accent);
    }

    .verify {
      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      padding: 14px;
      margin: 10px 0;
      background: #FFFFFF;
    }

    .verify.done {
      background: var(--success-light);
      border-color: var(--success-border);
    }

    .verify h4 {
      margin: 0 0 6px;
      font-size: 13px;
    }

    .demo {
      background: var(--warn-light);
      border: 1px dashed var(--warn-border);
      border-radius: var(--radius-xs);
      padding: 10px 12px;
      margin: 8px 0;
      font-size: 13px;
    }

    .demo b {
      font-size: 18px;
      letter-spacing: 3px;
    }

    /* WhatsApp Simulator Skin */
    .wa .chatbox {
      background: #EFEAE2;
    }

    .wa .bubble.customer {
      background: #D9FDD3;
      border-color: #B6E7AD;
      color: #051C2C;
    }

    .wa .bubble.customer .sender {
      color: #5A6D7C;
    }

    .wa .bubble.assistant {
      background: #FFFFFF;
      border-left: 1px solid var(--line);
    }

    .wabar {
      background: #075E54;
      color: #FFFFFF;
      border-radius: var(--radius-xs);
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ws {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .ws .panel {
      margin: 0;
    }

    .kv {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 6px 12px;

    .kv b {
      color: var(--text-secondary);
      font-weight: 600;
    }

    pre.excerpt {
      white-space: pre-wrap;
      font-size: 12px;
      background: var(--cream-soft);
      padding: 12px;
      border-radius: var(--radius-xs);
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      font-family: var(--font-mono);
    }

    table.grid {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.grid th,
    table.grid td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);

    }

    table.grid tr.clickable:hover {

    }

    .bar {
      height: 6px;
      border-radius: var(--radius-xs);
      background: var(--line);
      overflow: hidden;
    }

    .bar>span {

      height: 100%;
      background: var(--ink);

    .notice {
      padding: 12px 14px;
      border: 1px solid var(--warn-border);
      background: var(--warn-light);
      color: var(--warn);

      margin-bottom: 12px;
      font-size: 13px;
    }

    .notice.red {
      border-color: var(--danger-border);
      background: var(--danger-light);
      color: var(--danger);
    }

    .empty {
      color: var(--text-muted);
      padding: 24px;
      text-align: center;
      font-size: 13px;
    }

    .quick {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0;
    }

    .quick button {

      background: #FFFFFF;
      color: var(--ink);
      border-radius: var(--radius-xs);
      padding: 6px 12px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .quick button:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .drop {
      display: block;
      cursor: pointer;
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 26px;
      text-align: center;
      background: var(--cream-soft);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .drop.over {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .drop b {
      color: var(--ink);
    }

    .filelist {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }

    .filelist li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line);
    }

    .result {
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: var(--radius-xs);
      margin: 6px 0;
      background: var(--cream-soft);

      background: var(--success-light);
      color: var(--success);

      background: var(--danger-light);
      color: var(--danger);
    }

      color: var(--text-secondary);
    }

      border: 1px solid var(--line);
      border-radius: var(--radius-xs);
      margin: 8px 0;
      background: #FFFFFF;

    .chunk.off {

      background: #FAFAFA;
    }

      margin: 6px 0;
      color: var(--text-secondary);

    dialog {

    .dialoghead {

      align-items: center;

      border-bottom: 1px solid var(--line);

      overflow-y: auto;
    }

    .filters {

      gap: 6px;

      margin: 8px 0;
    }

    .filters .field {
      width: auto;
      flex: 1;
      min-width: 140px;
      padding: 7px 10px;

    details summary {

      color: var(--ink);

    hr.sep {

      border-top: 1px solid var(--line);

    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);

   Editorial Login & Authentication Screen
   ========================================================================== */
    .login-backdrop {
      min-height: 100vh;
      background-color: var(--ink);
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .loginwrap {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 56px;
      align-items: center;

    .hero-box {
      color: #FFFFFF;
    }

    .hero-brand-wrap {
      margin-bottom: 24px;
    }

    .hero-brand-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      padding: 10px 18px;
      border-radius: var(--radius-sm);

    .hero-brand-card img {
      max-width: 170px;

      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .hero-box h1 {
      font-family: var(--font-serif);
      font-size: clamp(34px, 4.6vw, 52px);
      line-height: 1.12;
      font-weight: 500;
      margin: 16px 0 20px;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .hero-box h1 em {
      font-style: italic;
      font-family: var(--font-serif);
      color: #FFFFFF;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-underline-offset: 6px;
    }

    .hero-box p.muted {
      color: rgba(255, 255, 255, 0.72);

    .hero-tags {

    }

    .hero-tags .tag {

      font-weight: 600;

    .loginpanel {
      background: #FFFFFF;

      box-shadow: var(--shadow-elevated);

    .loginpanel h2 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--ink);
    }

    .loginpanel p.muted {

    }

    .demo-group {
      margin-top: 16px;
      padding-top: 14px;

    }

    .demo-group-label {
      font-size: 11px;

    .demo-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Responsive Media Queries */
    @media(max-width: 1024px) {
      .app-sidebar {
        position: fixed;
        transform: translateX(-100%);
      }

      .app-sidebar.open {
        transform: translateX(0);
      }

      .sidebar-toggle-btn {
        display: inline-block;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 28, 44, 0.5);
        z-index: 35;
      }

      .sidebar-overlay.open {
        display: block;
      }

    @media(max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));

      .loginwrap {
        padding: 10px;

      }

      }

    @media(max-width: 480px) {

        grid-template-columns: 1fr 1fr;
      }

      .panel {
        padding: 16px;
      }

      .bubble {
        max-width: 94%;
      }

      .pagehead h1 {
        font-size: 22px;
      }

      .formgrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="dlg">
    <div class="dialoghead"><b id="dlgtitle"></b><button class="btn secondary small" onclick="closeDlg()">Tutup</button>
    </div>
    <div id="dlgbody" class="dialogbody"></div>
  </dialog>

  <script>
    const API = 'http://127.0.0.1:8000';
    let token = localStorage.getItem('vteki_token') || '', me = null, maxStrikes = 3, tab = 'chat', cases = [], activeCase = null, messages = [], notifications = [], dashboard = null, approvals = [], auditRows = [], busy = false;
    let auth = null, ephemeral = {}, pendingAsk = null, otpChallenge = null, ws = null, crmMeta = null, handoffs = [], tickets = [], analytics = null, qaSample = [], caseEvidence = [], emailResult = null, copilotUsed = false;
    let docs = [], manualCount = 0, activeDoc = null, docChunks = [], chunkFilter = { q: '', kind: '', status: '' }, pendingFiles = [], uploadResults = [], searchResult = null, guard = { items: [], users: [] }, guardPending = 0;
    let sidebarOpen = false;
    const CATS = ['Umum', 'FAQ', 'Kontak', 'Layanan Digital', 'Simpanan', 'Keamanan', 'Pengaduan', 'Kartu', 'Pinjaman', 'Biaya & Limit', 'Sumber Resmi', 'Kebijakan', 'Produk', 'Instruksi AI', 'Metadata', 'Arsip lama'];
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

    async function req(path, opts = {}) {
      const headers = { ...(opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }), ...(opts.headers || {}) };
      if (token) headers.Authorization = 'Bearer ' + token;
      let r;
      try {
        r = await fetch(API + '/api' + path, { ...opts, headers });
      } catch (e) {
        throw new Error('Tidak dapat terhubung ke backend gateway (jalankan backend di port 8000).');
      }
      let d = {};
      try { d = await r.json(); } catch { }
      if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (d.detail?.[0]?.msg || 'Permintaan gagal (' + r.status + ')'));
      return d;
    }

    function toast(s) {
      const e = $('#toast');
      e.textContent = s;
      e.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => e.classList.add('hidden'), 3800);
    }

    function btn(label, fn, cls = 'btn') {
      return `<button class="${cls}" onclick="${fn}">${label}</button>`;
    }

    function openDlg(title, html) {
      $('#dlgtitle').textContent = title;
      $('#dlgbody').innerHTML = html;
      $('#dlg').showModal();
    }

    function closeDlg() { $('#dlg').close(); }

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      const sb = document.querySelector('.app-sidebar');
      const ol = document.querySelector('.sidebar-overlay');
      if (sb) sb.classList.toggle('open', sidebarOpen);
      if (ol) ol.classList.toggle('open', sidebarOpen);
    }

    function statusTag(s) {
      const cls = {
        'Menunggu Persetujuan': 'red', 'Menunggu Agen': 'warn', 'Ditangani Agen': 'blue',
        'Menunggu Nasabah': 'gray', 'Diproses AI': 'blue', 'Dibuka Kembali': 'warn',
        'Menunggu persetujuan': 'red', 'Dialihkan ke admin': 'red', 'Menunggu agen': 'warn',
        'Ditangani': 'blue', 'Baru': 'gray', 'Ditolak': 'gray'
      }[s] || 'green';
      return `<span class="tag ${cls}">${esc(s)}</span>`;
    }

    /* ---------------- Login & Splash Screen ---------------- */
    let authMode = 'login';
    function loginView() {
      const registering = authMode === 'register';
      $('#app').innerHTML = `
  <div class="login-backdrop">
    <div class="loginwrap">
      <section class="hero-box">
        <div class="hero-brand-wrap">
          <div class="hero-brand-card">
            <img src="vteki_logo.png" alt="V-TEKI IT & Business Consulting">
          </div>
        </div>
        <div style="font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;">Enterprise Support Suite</div>
        <h1>Layanan Pelanggan yang <em>Presisi</em>, Terukur & Terpercaya.</h1>
        <p class="muted">Platform terintegrasi untuk manajemen operasional customer service enterprise. Hadirkan tata kelola keluhan nasabah, repositori pengetahuan terverifikasi, dan alur eskalasi bertingkat dengan kepatuhan tinggi.</p>
        <div class="hero-tags">
          <div class="tag">Omnichannel Service Desk</div>
          <div class="tag">Knowledge Repository</div>
          <div class="tag">SLA & Escalation Engine</div>
          <div class="tag">Multi-tier Authentication</div>
        </div>
      </section>
      <form class="loginpanel" onsubmit="${registering ? 'doRegister(event)' : 'doLogin(event)'}">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">Akses Portal Resmi</div>
        <h2>${registering ? 'Registrasi Akun Baru' : 'Masuk ke Workspace'}</h2>
        <p class="muted">${registering ? 'Daftarkan akun nasabah Anda untuk mengakses layanan terpadu.' : 'Silakan masuk menggunakan kredensial Anda atau pilih akun uji coba di bawah.'}</p>
        ${registering ? `<div class="formrow"><label>Nama Lengkap Nasabah</label><input id="registerName" class="field" type="text" required minlength="2" maxlength="100" placeholder="Nama lengkap Anda"></div>` : ''}
        <div class="formrow">
          <label>Alamat Email</label>
          <input id="email" class="field" type="email" required ${registering ? 'placeholder="nama@email.com"' : 'value="customer@vteki.id"'}>
        </div>
        <div class="formrow">
          <label>Kata Sandi</label>
          <input id="password" class="field" type="password" required ${registering ? 'minlength="8" placeholder="Minimal 8 karakter"' : 'value="cust1234"'}>
        </div>
        <button class="btn" style="width:100%;margin-top:8px;">${registering ? 'Daftar Sekarang' : 'Masuk ke Sistem'}</button>
        ${registering ? '' : `
        <div class="demo-group">
          <div class="demo-group-label">Akses Cepat Mode Uji Coba</div>
          <div class="demo-buttons">
            <button type="button" class="btn secondary small" onclick="fillDemo('customer')">Nasabah</button>
            <button type="button" class="btn secondary small" onclick="fillDemo('agent')">Petugas CS</button>
            <button type="button" class="btn secondary small" onclick="fillDemo('admin')">Supervisor</button>
          </div>
          <div class="demo-buttons" style="margin-top:8px;">
            <button type="button" class="btn secondary small" onclick="startGuest('web')">Sesi Tamu (AL0)</button>
            <button type="button" class="btn secondary small" onclick="startGuest('whatsapp')">Simulator WhatsApp</button>
          </div>
        </div>
        `}
        <p class="sub" style="text-align:center;margin-top:20px;color:var(--text-secondary);">
          ${registering ? 'Sudah memiliki akun?' : 'Belum memiliki akun?'}
          <a href="#" onclick="toggleAuthMode(event)" style="color:var(--accent);font-weight:700;text-decoration:none;">
            ${registering ? 'Masuk di sini' : 'Daftar akun baru'}
          </a>
        </p>
      </form>
    </div>
  </div>`;
    }

    function toggleAuthMode(e) {
      e.preventDefault();
      authMode = authMode === 'login' ? 'register' : 'login';
      loginView();
    }

    function fillDemo(role) {
      const a = {
        admin: ['admin@vteki.id', 'admin123'],
        agent: ['agen@vteki.id', 'agen1234'],
        customer: ['customer@vteki.id', 'cust1234']
      }[role];
      $('#email').value = a[0];
      $('#password').value = a[1];
    }

    async function completeAuth(d) {
      token = d.access_token;
      me = d.user;
      localStorage.setItem('vteki_token', token);
      await refreshMe();
      tab = me.role === 'admin' ? 'dashboard' : 'chat';
      await loadTab();
      render();
    }

    async function doLogin(e) {
      e.preventDefault();
      try {
        const d = await req('/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#password').value }) });
        await completeAuth(d);
      } catch (e) { toast(e.message); }
    }

    async function doRegister(e) {
      e.preventDefault();
      try {
        const d = await req('/auth/register', { method: 'POST', body: JSON.stringify({ name: $('#registerName').value, email: $('#email').value, password: $('#password').value }) });
        authMode = 'login';
        await completeAuth(d);
        toast('Akun berhasil dibuat. Selamat datang di portal V-TEKI.');
      } catch (e) { toast(e.message); }
    }

    async function logout() {
      try { await req('/auth/logout', { method: 'POST' }); } catch { }
      token = ''; me = null; activeCase = null; auth = null; ephemeral = {}; pendingAsk = null; ws = null; cases = []; messages = [];
      localStorage.removeItem('vteki_token');
      render();
    }

    /* ---------------- Vector SVG Icon System ---------------- */
    const ICONS = {

      cases: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
      handoffs: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
      tickets: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"></path><line x1="12" y1="9" x2="12" y2="15"></line></svg>`,
      approvals: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>`,
      analytics: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`,
      knowledge: `<svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,

    /* ---------------- Master Sidebar Application Shell ---------------- */
    function shell(content) {
      const admin = me.role === 'admin';
      const sup = admin && (me.staff_role || 'supervisor') === 'supervisor';
      const guest = !admin && me.is_guest;

      const navSections = admin ? [
        {
          group: 'Operasional Layanan',
          items: [
            ['dashboard', 'Dasbor Operasional', ICONS.dashboard],
            ['cases', 'Manajemen Kasus', ICONS.cases],
            ['handoffs', 'Antrean Handoff', ICONS.handoffs],
            ['tickets', 'Tiket CRM', ICONS.tickets]
          ]
        },
        ...(sup ? [
          {
            group: 'Otorisasi & Mutu',
            items: [
              ['approvals', 'Persetujuan Tindakan', ICONS.approvals],
              ['analytics', 'Analitik & SLA', ICONS.analytics]
            ]
          },
          {
            group: 'Kebijakan & Kepatuhan',
            items: [
              ['knowledge', 'Basis Pengetahuan & SOP', ICONS.knowledge],
              ['guardrail', 'Pengawasan Kepatuhan', ICONS.guardrail, guardPending],
              ['email', 'Simulator Email', ICONS.email],
              ['audit', 'Audit Trail Kepatuhan', ICONS.audit]
            ]
          }
        ] : []),
        {
          group: 'Komunikasi',
          items: [
            ['notifications', 'Pemberitahuan Sistem', ICONS.notifications, dashboard?.unread_notifications]
          ]
        }
      ] : [
        {
          group: 'Layanan Nasabah',
          items: [
            ['chat', me.channel === 'whatsapp' ? 'WhatsApp Support' : 'Layanan Pelanggan', ICONS.chat],
            ...(guest ? [] : [['notifications', 'Pemberitahuan', ICONS.notifications]])
          ]
        }
      ];

      const currentTabTitle = (() => {
        for (const sec of navSections) {
          for (const it of sec.items) {
            if (it[0] === tab) return it[1];
          }
        }
        return 'Layanan Pelanggan';
      })();

      const userRoleLabel = admin ? ((me.staff_role || 'supervisor') === 'agent' ? 'Petugas CS' : 'Supervisor Operasional') : (me.is_guest ? (me.channel === 'whatsapp' ? 'Tamu · WhatsApp' : 'Sesi Tamu') : 'Nasabah Terdaftar');
      const userInitials = (me.name || 'User').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const orgName = (typeof ORG === 'function' ? ORG() : '') || 'Bank BCA';

      return `
  <div class="app-shell ${!admin && me.channel === 'whatsapp' ? 'wa' : ''}">
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-card">
          <img src="vteki_logo.png" alt="V-TEKI IT & Business Consulting" class="brand-logo-img">
        </div>
        <div class="brand-badge-sub">
          <span>Enterprise Portal</span>
          <span class="live-dot" title="Sistem Aktif"></span>
        </div>
      </div>
      <div class="sidebar-scroll">
        ${navSections.map(sec => `
          <div class="nav-section-title">${sec.group}</div>
          ${sec.items.map(([id, label, icon, badgeCount]) => `
            <button class="nav-item ${tab === id ? 'active' : ''}" onclick="go('${id}');if(sidebarOpen)toggleSidebar();">
              <span class="nav-item-left">
                <span class="nav-icon">${icon || ''}</span>
                <span>${label}</span>
              </span>
              ${badgeCount ? `<span class="nav-badge">${badgeCount}</span>` : ''}
            </button>
          `).join('')}
        `).join('')}
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="user-avatar">${userInitials}</div>
          <div class="user-meta">
            <div class="user-meta-name" title="${esc(me.name)}">${esc(me.name)}</div>
            <div class="user-meta-role">${userRoleLabel}</div>
          </div>
        </div>
        <div class="sidebar-actions">
          ${!admin && auth ? `
            <button class="alpill l${auth.level}" style="width:100%;margin-bottom:6px;justify-content:center;" title="Tingkat Verifikasi: ${esc(auth.allows)}" onclick="openVerify(${auth.level < 2 ? 2 : 3})">
              ${ICONS.shield} ${esc(auth.code)} &middot; ${esc(auth.name)}
            </button>
          ` : ''}
          <button class="btn secondary small" style="width:100%;border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:#fff;" onclick="logout()">Keluar dari Portal</button>
        </div>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Navigasi">${ICONS.menu}</button>
          <div class="topbar-breadcrumbs">
            <span class="root">V-TEKI Workspace</span>
            <span class="sep">/</span>
            <span class="current">${currentTabTitle}</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="org-pill">${ICONS.building} ${esc(orgName)}</div>
          <div class="sub" style="font-size:11.5px;color:var(--text-secondary);">&#9679; Gateway Terhubung</div>
        </div>
      </header>
      <div class="app-content">
        ${content}
      </div>
      <footer class="app-footer">
        <span>&copy; 2026 V-TEKI IT &amp; Business Consulting. Hak Cipta Dilindungi.</span>
        <span>Platform Layanan &amp; Manajemen Keluhan Pelanggan Enterprise</span>
      </footer>
    </main>
  </div>`;
    }

    async function go(t) {
      tab = t;
      try { await loadTab(); render(); } catch (e) { toast(e.message); }
    }

    async function refreshMe() {
      try {
        const d = await req('/auth/me');
        me = d.user;
        maxStrikes = d.max_strikes || 3;
        auth = d.auth || null;
        window._org = d.org;
      } catch { }
    }

    async function loadTab() {
      if (!me) return;
      if (me.role === 'admin') {
        try {
          const g = await req('/admin/guardrail?only_pending=true');
          guardPending = g.items.length;
        } catch { }
      }
      if (tab === 'chat' || tab === 'cases') {
        if (tab === 'chat') await refreshMe();
        cases = (await req('/cases')).items;
        if (!activeCase || !cases.some(c => c.id === activeCase)) activeCase = cases.length ? cases[0].id : null;
        if (activeCase) {
          messages = (await req('/cases/' + encodeURIComponent(activeCase) + '/messages')).items;
          if (tab === 'cases') {
            ws = await req('/admin/cases/' + encodeURIComponent(activeCase) + '/workspace');
            if (!crmMeta) crmMeta = await req('/crm/meta');
          } else {
            caseEvidence = (await req('/cases/' + encodeURIComponent(activeCase) + '/evidence')).items;
          }
        } else {
          messages = []; ws = null; caseEvidence = [];
        }
      }
      if (tab === 'handoffs') handoffs = (await req('/admin/handoffs')).items;
      if (tab === 'tickets') tickets = (await req('/admin/tickets')).items;
      if (tab === 'analytics') {
        analytics = await req('/admin/analytics');
        const q = await req('/admin/qa/sample?n=5');
        qaSample = q.items;
        if (!crmMeta) crmMeta = await req('/crm/meta');
      }
      if (tab === 'dashboard') dashboard = await req('/admin/dashboard');
      if (tab === 'knowledge') {
        const d = await req('/knowledge/documents');
        docs = d.items;
        manualCount = d.manual_articles;
        if (activeDoc !== null) await loadChunks(activeDoc);
      }
      if (tab === 'notifications') notifications = (await req('/notifications')).items;
      if (tab === 'approvals') approvals = (await req('/admin/approvals')).items;
      if (tab === 'audit') auditRows = (await req('/admin/audit')).items;
      if (tab === 'guardrail') guard = await req('/admin/guardrail');
    }

    function pagehead(title, desc, actions = '') {
      return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`;
    }

    function render() {
      if (!me) { loginView(); return; }
      const views = {
        handoffs: handoffsView,
        tickets: ticketsView,
        analytics: analyticsView,
        email: emailView,
        dashboard: dashboardView,
        chat: () => chatView(false),
        cases: () => chatView(true),
        knowledge: knowledgeView,
        notifications: notificationsView,
        approvals: approvalsView,
        audit: auditView,
        guardrail: guardrailView
      };
      $('#app').innerHTML = shell((views[tab] || chatView)());
      if (tab === 'knowledge') bindDrop();
      const m = $('#messages');
      if (m) m.scrollTop = m.scrollHeight;
    }

    /* ---------------- Dasbor Operasional ---------------- */
    function dashboardView() {
      const d = dashboard || { statuses: {} };
      const s = d.statuses || {};
      return pagehead('Dasbor Operasional Layanan', 'Ikhtisar aktivitas operasional, penanganan kasus nasabah, dan performa SLA.') +
        `<div class="grid">${[
          ['Total Kasus Terbuka', d.total_cases || 0],
          ['Menunggu Penanganan Petugas', s['Menunggu agen'] || 0],
          ['Menunggu Otorisasi Supervisor', s['Menunggu persetujuan'] || 0],
          ['Dialihkan ke Pengawas', s['Dialihkan ke admin'] || 0],
          ['Klausul SOP & Rujukan Aktif', d.active_knowledge_articles || 0],
          ['Dokumen Kebijakan Resmi', d.knowledge_documents || 0],
          ['Insiden Kepatuhan Perlu Ditinjau', d.guardrail_pending || 0],
          ['Profil dalam Pembatasan Akses', d.suspended_users || 0]
        ].map(([l, v]) => `
    <div class="panel" style="margin:0">
      <div class="metriclabel">${l}</div>
      <div class="metric">${v}</div>
    </div>`).join('')}
  </div>
  <div class="grid2" style="margin-top:16px">
    <div class="panel">
      <h3 class="sectiontitle">Spesifikasi Arsitektur Sistem</h3>
      <p>Mesin Pengolah: <b>V-TEKI Enterprise Engine (Core v2.0)</b></p>
      <p>Pipeline Layanan: <span class="tag blue">Multi-Tier State Engine</span> Klasifikasi Masalah: <span class="tag ${d.llm_classifier ? 'green' : 'gray'}">${d.llm_classifier ? 'Klasifikasi Cerdas Aktif' : 'Aturan Pola Baku'}</span></p>
      <p>Status Konektivitas Gateway: <span class="tag ${d.gemini_configured ? 'green' : 'warn'}">${d.gemini_configured ? 'Gateway Terkoneksi' : 'Kunci Konfigurasi Belum Diatur'}</span></p>
      <p>Lingkup Entitas: <b>${esc(d.org || 'Perbankan')}</b> &middot; Ambang Batas Kepatuhan: <b>${d.max_strikes || 3} kali toleransi</b></p>
      <p class="muted">Seluruh transaksi dan data pribadi nasabah diamankan di tingkat server sesuai standar kepatuhan perbankan.</p>
      ${btn('Lihat Diagram Alur Layanan', 'showGraph()', 'btn secondary small')}
    </div>
    <div class="panel" style="margin-top:0">
      <h3 class="sectiontitle">Aktivitas Operasional Terkini</h3>
      ${(d.recent_audit || []).map(a => `<div class="listitem"><b>${esc(a.action)}</b><div class="sub">${esc(a.user_email)} &middot; ${esc(a.created_at)}</div></div>`).join('') || '<div class="empty">Belum ada aktivitas operasional tercatat.</div>'}
    </div>
  </div>`;
    }

    async function showGraph() {
      try {
        const g = await req('/admin/graph');
        openDlg('Diagram Alur Percabangan Layanan & Eskalasi', `<p class="muted">Alur logika penanganan tiket dari penerimaan, klasifikasi, verifikasi identitas hingga eskalasi petugas.</p><pre style="white-space:pre-wrap;font-size:12px;background:var(--cream-soft);padding:14px;border:1px solid var(--line);border-radius:var(--radius-xs);font-family:var(--font-mono);">${esc(g.mermaid)}</pre><p class="sub">Teks definisi grafik di atas dapat divisualisasikan melalui mermaid.live.</p>`);
      } catch (e) { toast(e.message); }
    }

    /* ---------------- Verifikasi Identitas Nasabah (AL0-AL3) ---------------- */
    function verifyHtml(target) {
      const a = auth || { level: 1 };
      const lv = a.levels || [];
      const row = l => {
        const x = lv.find(v => v.level === l) || {};
        return `<div class="listitem"><b>${esc(x.code || 'AL' + l)} &middot; ${esc(x.name || '')}</b>${a.level >= l ? ' <span class="tag green">tercapai</span>' : ''}<div class="sub">${esc(x.how || '')} &rarr; ${esc(x.allows || '')}</div></div>`;
      };
      const otp = a.level >= 2
        ? `<div class="verify done"><h4>Langkah 1 &middot; Verifikasi OTP (AL2) &#10003;</h4><div class="sub">Terverifikasi${a.expires_at ? ' &middot; berlaku sampai ' + esc(a.expires_at) + ' UTC' : ''}</div></div>`
        : !a.can_verify_otp
          ? `<div class="verify"><h4>Langkah 1 &middot; Verifikasi OTP (AL2)</h4><div class="notice">Nomor handphone belum terdaftar pada profil ini. Hubungi petugas resmi untuk pembaruan data.</div></div>`
          : `<div class="verify"><h4>Langkah 1 &middot; Verifikasi OTP (AL2)</h4>${a.otp_locked_until ? `<div class="notice red">Verifikasi OTP sesi ini dikunci sampai ${esc(a.otp_locked_until)} UTC akibat 3x kegagalan berturut-turut. Permintaan dialihkan ke petugas customer service.</div>` : ''}<div class="sub">${a.is_guest ? 'Anda mengakses sebagai tamu. Masukkan nomor HP terdaftar untuk menerima 6 digit kode pengesahan.' : 'Kode 6 digit akan dikirimkan ke nomor terdaftar ' + esc(a.phone_hint) + '.'}</div>${a.is_guest && !otpChallenge ? `<div class="formrow"><label>Nomor Handphone Terdaftar</label><input id="otpphone" class="field" inputmode="tel" placeholder="08xxxxxxxxxx" value="081234567890"></div>` : ''}${otpChallenge ? `<div class="sub">Terkirim melalui: ${esc(otpChallenge.channel)} &middot; berlaku ${Math.round(otpChallenge.expires_in / 60)} menit</div>${otpChallenge.demo_otp ? `<div class="demo">Mode Uji Coba: Kode OTP pengesahan Anda adalah <b>${esc(otpChallenge.demo_otp)}</b></div>` : ''}<div class="formrow"><label>Kode OTP Pengesahan</label><input id="otpcode" class="field" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><div class="actions">${btn('Verifikasi OTP', 'confirmOtp(' + target + ')', 'btn')}${btn('Kirim Ulang', 'requestOtp(' + target + ')', 'btn secondary')}</div>` : btn('Kirim Kode OTP', 'requestOtp(' + target + ')', 'btn')}</div>`;

      const pin = target < 3 ? '' : a.level >= 3
        ? `<div class="verify done"><h4>Langkah 2 &middot; PIN Otorisasi (AL3) &#10003;</h4><div class="sub">Terverifikasi${a.expires_at ? ' &middot; berlaku sampai ' + esc(a.expires_at) + ' UTC' : ''}</div></div>`
        : `<div class="verify"><h4>Langkah 2 &middot; PIN Otorisasi (AL3)</h4>${a.pin_locked_until ? `<div class="notice red">Otorisasi PIN dikunci sementara sampai ${esc(a.pin_locked_until)} UTC.</div>` : a.level < 2 ? '<div class="sub">Selesaikan verifikasi langkah 1 terlebih dahulu.</div>' : `<div class="formrow"><label>PIN Transaksi / Otorisasi</label><input id="pincode" class="field" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></div>${btn('Verifikasi PIN', 'confirmPin()', 'btn')}`}</div>`;

      return `<p class="muted">Verifikasi memastikan hak kepemilikan rekening sebelum data rahasia dapat diakses atau permohonan berisiko dijalankan. Kode pengesahan dimasukkan melalui dialog aman ini dan <b>tidak pernah</b> disimpan di riwayat obrolan umum.</p><div class="sub" style="margin-bottom:12px;">Status Saat Ini: <b>${esc(a.code || 'AL1')} &middot; ${esc(a.name || '')}</b></div>${otp}${pin}<details style="margin-top:14px;"><summary>Informasi Standar Tingkat Autentikasi (AL0 - AL3)</summary>${[0, 1, 2, 3].map(row).join('')}</details>${a.level >= 2 ? `<div class="actions" style="margin-top:14px;">${btn('Akhiri Sesi Terverifikasi', 'revokeVerify()', 'btn secondary small')}</div>` : ''}`;
    }

    let verifyTarget = 2;
    async function openVerify(target) {
      verifyTarget = target || 2;
      await refreshMe();
      openDlg('Pusat Verifikasi Identitas Nasabah', verifyHtml(verifyTarget));
    }
    function redrawVerify() { $('#dlgbody').innerHTML = verifyHtml(verifyTarget); }

    async function requestOtp(target) {
      try {
        otpChallenge = await req('/auth/verify/otp/request', { method: 'POST', body: JSON.stringify({ phone: $('#otpphone')?.value || '' }) });
        redrawVerify();
        const i = $('#otpcode');
        if (i) i.focus();
      } catch (e) { toast(e.message); }
    }

    async function confirmOtp(target) {
      const code = ($('#otpcode')?.value || '').trim();
      if (!code) return;
      try {
        auth = await req('/auth/verify/otp/confirm', { method: 'POST', body: JSON.stringify({ challenge_id: otpChallenge.challenge_id, code, case_id: activeCase }) });
        otpChallenge = null;
        toast('Verifikasi identitas AL2 berhasil disahkan.');
        await afterVerify();
      } catch (e) {
        toast(e.message);
        if (/hangus|tidak berlaku|kedaluwarsa|dikunci/i.test(e.message)) {
          otpChallenge = null;
          await refreshMe();
          redrawVerify();
          if (/dikunci/i.test(e.message)) { await loadTab(); render(); }
        }
      }
    }

    async function confirmPin() {
      const pin = ($('#pincode')?.value || '').trim();
      if (!pin) return;
      try {
        auth = await req('/auth/verify/pin', { method: 'POST', body: JSON.stringify({ pin, case_id: pendingAsk?.case_id || activeCase || null }) });
        toast('Otorisasi AL3 berhasil dikonfirmasi.');
        await afterVerify();
      } catch (e) {
        toast(e.message);
        await refreshMe();
        redrawVerify();
      }
    }

    async function revokeVerify() {
      try {
        auth = await req('/auth/verify/revoke', { method: 'POST' });
        ephemeral = {};
        closeDlg();
        render();
        toast('Sesi verifikasi telah diakhiri (kembali ke AL1).');
      } catch (e) { toast(e.message); }
    }

    async function afterVerify() {
      if (auth.level < verifyTarget) { redrawVerify(); render(); return; }
      closeDlg();
      const p = pendingAsk;
      pendingAsk = null;
      if (p && p.resend && auth.level >= p.level) {
        activeCase = p.case_id;
        render();
        const inp = $('#message');
        if (inp) { inp.value = p.message; await sendMessage({ preventDefault() { } }); }
        return;
      }
      if (p && !p.resend) toast('Permintaan ' + p.case_id + ' telah diverifikasi AL3 untuk ditindaklanjuti.');
      await loadTab(); render();
    }

    /* ---------------- Obrolan & Manajemen Kasus ---------------- */
    function bubble(m, admin) {
      const meta = m.meta || {};
      const kind = meta.kind || '';
      let cls = m.sender;
      if (m.sender === 'system') cls = kind === 'warning' ? 'warning' : 'system';
      if (m.sender === 'customer' && meta.flagged) cls += ' flagged';

      const orgName = (typeof ORG === 'function' ? ORG() : '') || 'Layanan Nasabah';
      const who = m.sender === 'customer' ? (admin ? 'Nasabah' : 'Anda') : m.sender === 'agent' ? 'Petugas Customer Service' : m.sender === 'system' ? (kind === 'warning' ? 'Pemberitahuan Sistem Keamanan' : 'Pemberitahuan Sistem') : `Dukungan Resmi ${esc(orgName)}`;

    async function selectCase(id) {
      activeCase = id;
      try { await loadTab(); render(); } catch (e) { toast(e.message); }
    }

    async function newCase() {
      try {
        const d = await req('/cases', { method: 'POST', body: JSON.stringify({ subject: 'Percakapan baru' }) });
        activeCase = d.case_id;
        messages = d.messages || [];
        cases = (await req('/cases')).items;
        render();
      } catch (e) { toast(e.message); }
    }

    function quickSend(q) {
      $('#message').value = q;
      $('#message').focus();
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = $('#message');
      const message = input.value.trim();
      if (!message || busy) return;
      busy = true;
      render();
      try {
        if (me.role === 'admin') {
          if (!activeCase) throw new Error('Pilih kasus terlebih dahulu.');
          await req('/admin/cases/' + encodeURIComponent(activeCase) + '/reply', {
            method: 'POST',
            body: JSON.stringify({ message, copilot_used: copilotUsed, awaiting_customer: !!$('#awaitcust')?.checked })
          });
          copilotUsed = false;
          toast('Tanggapan petugas berhasil dikirimkan.');
          await loadTab();
        } else {
          const cur = cases.find(c => c.id === activeCase);
          const caseId = cur && !['Selesai', 'Ditolak'].includes(cur.status) ? activeCase : null;
          const d = await req('/chat', { method: 'POST', body: JSON.stringify({ message, case_id: caseId }) });
          activeCase = d.case_id;
          if (d.reply_kind === 'account') ephemeral[d.message_id] = d.reply;
          if (auth) auth.level = d.auth_level;
          pendingAsk = d.auth_required && d.auth_level < d.auth_required ? { message, level: d.auth_required, case_id: d.case_id, resend: d.reply_kind === 'auth_required' } : null;
          me.guardrail_strikes = d.strikes;
          me.ai_suspended = d.ai_suspended ? 1 : 0;
          maxStrikes = d.max_strikes || maxStrikes;

          if (d.warning) toast(`Peringatan Kepatuhan ${Math.min(d.strikes, d.max_strikes)}/${d.max_strikes}: Kasus dialihkan ke supervisor.`);
          else if (d.masked?.length) toast('Informasi sensitif disamarkan demi keamanan data nasabah.');
          else if (pendingAsk) toast('Diperlukan verifikasi identitas (AL' + pendingAsk.level + ').');
          else if (d.handoff_id) toast('Kasus dialihkan ke petugas customer service (' + d.handoff_id + (d.ticket_id ? ' · ' + d.ticket_id : '') + ').');
          else if (d.ticket_id) toast('Tiket ' + d.ticket_id + ' telah diperbarui: ' + d.status);
          else if (d.clarify) toast('Mohon perjelas rincian pertanyaan Anda.');
          else toast('Permintaan diproses &middot; ' + d.status);
        }
        await loadTab();
      } catch (err) {
        toast(err.message);
      } finally {
        busy = false;
        render();
        const inp = $('#message');
        if (inp) inp.focus();
      }
    }

    async function unlockAI(id) {
      try {
        await req('/admin/cases/' + encodeURIComponent(id) + '/unlock-ai', { method: 'POST' });
        toast('Mode otomatis diaktifkan kembali untuk kasus ini.');
        await loadTab(); render();
      } catch (e) { toast(e.message); }
    }

    async function resolveCase(id) {
      if (!confirm('Tandai penyelesaian kasus ' + id + '?')) return;
      try {
        await req('/admin/cases/' + encodeURIComponent(id) + '/resolve', { method: 'POST' });
        await loadTab(); render();
      } catch (e) { toast(e.message); }
    }
