<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-TEKI Workspace</title>
<style>
:root{--bg:#07151d;--panel:#0c202b;--panel2:#102b37;--line:#20404d;--text:#e8f1f4;--muted:#93aab4;--teal:#20d6c3;--gold:#efbd58;--red:#ff777d;--green:#5be0b3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#0d3540 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1380px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border:1px solid var(--line);background:#071a23e8;border-radius:18px;flex-wrap:wrap}.logo{font-size:22px;font-weight:800;letter-spacing:.04em}.logo span{color:var(--teal)}.sub{color:var(--muted);font-size:12px}.userline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted)}.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;background:var(--teal);color:#06211f;font-weight:700}.btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}.btn.danger{background:#4b2026;color:#ffdfe0;border-color:#78363d}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);white-space:nowrap}.nav button.active{background:#113b43;border-color:var(--teal);color:var(--teal)}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 16px;flex-wrap:wrap}.pagehead h1{font-size:26px;margin:0}.pagehead p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:minmax(240px, .8fr) minmax(0,1.4fr);gap:14px}.panel{background:linear-gradient(145deg,#102733,#0a1e28);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.metric{font-size:30px;font-weight:800;letter-spacing:-.04em;margin:6px 0}.metriclabel{color:var(--muted)}.sectiontitle{font-weight:750;font-size:15px;margin:0 0 12px}.muted{color:var(--muted)}.formrow{display:grid;gap:6px;margin:10px 0}.formrow label{color:var(--muted);font-size:12px}.field{width:100%;background:#061720;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}.field:focus{border-color:var(--teal)}textarea.field{resize:vertical;min-height:100px}.loginwrap{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;max-width:1100px;margin:auto;padding:40px}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.08;margin:20px 0}.hero h1 span{color:var(--teal)}.loginpanel{padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px}.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chatbox{height:58vh;min-height:340px;max-height:680px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px 3px}.bubble{max-width:82%;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#102733}.bubble.customer{align-self:flex-end;background:#153d3b;border-color:#236b64}.bubble.agent{align-self:flex-start;background:#263044}.bubble.assistant{align-self:flex-start}.sender{font-size:11px;color:var(--muted);margin-bottom:4px}.sendrow{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}.sendrow input{flex:1;min-width:0}.caseitem,.listitem{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#0a1c25}.caseitem.active{border-color:var(--teal);background:#10333b}.caseitem:hover{border-color:#3a6b77}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#183d45;color:var(--teal);font-size:11px;margin:3px 3px 3px 0}.tag.warn{background:#453718;color:#f6d17c}.tag.red{background:#4b2529;color:#ffb1b5}.tag.green{background:#123e33;color:var(--green)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.actions{display:flex;gap:6px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#071b24;border:1px solid var(--teal);border-radius:999px;max-width:90vw;z-index:9}.notice{padding:12px;border:1px solid #6c5628;background:#30280f;color:#f6d17c;border-radius:12px;margin-bottom:12px}.empty{color:var(--muted);padding:20px;text-align:center}.quick{display:flex;gap:6px;overflow:auto;padding:8px 0}.quick button{border:1px solid var(--line);background:#102b37;color:var(--teal);border-radius:999px;padding:7px 10px;white-space:nowrap}.footer{margin:20px 0;color:var(--muted);font-size:11px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.loginwrap{grid-template-columns:1fr}.loginwrap{padding:22px}.hero h1{font-size:34px}.shell{padding:12px}.chatbox{height:55vh}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.panel{padding:13px}.bubble{max-width:94%}.pagehead h1{font-size:22px}}
/* V-TEKI light customer-service theme — presentation only; API and JS unchanged */
:root{
  --bg:#f4f7fa;--panel:#ffffff;--panel2:#f8fbfc;--line:#e1e8ee;
  --text:#1d2935;--muted:#667786;--teal:#19bfae;--gold:#a86a08;
  --red:#d9434e;--green:#16865f;
  color-scheme:light;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text)}
#app{min-height:100vh}
.shell{max-width:1400px}
.top{background:#fff;border-color:var(--line);box-shadow:0 2px 12px rgba(23,43,58,.045);border-radius:14px}
.logo{color:#233442}.logo span{color:var(--teal)}
.sub,.muted,.metriclabel,.pagehead p,.formrow label,.sender,.footer{color:var(--muted)}
.pill{border-color:var(--line);background:#f8fafc;color:#526575}
.btn{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 1px 2px rgba(18,75,71,.08)}
.btn:hover{filter:brightness(.97)}
.btn.secondary{background:#fff;color:#344655;border-color:#d7e1e8}
.btn.secondary:hover{background:#f4faf9;border-color:#9bded6}
.btn.danger{background:#fff1f2;color:#b42332;border-color:#f2c6cb}
.nav button{background:#fff;color:#536574;border-color:var(--line)}
.nav button:hover{background:#f3faf9;border-color:#a9e1db}
.nav button.active{background:#e8f8f6;border-color:#8ddbd2;color:#087f75}
.panel,.loginpanel{background:#fff;border:1px solid var(--line);box-shadow:0 3px 14px rgba(23,43,58,.045);border-radius:15px}
.metric{color:#1c3443}
.field{background:#fff;color:var(--text);border-color:#d7e1e8}
.field::placeholder{color:#95a3af}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,191,174,.12)}
.loginwrap{max-width:1160px;gap:56px}
.hero h1{color:#203443;letter-spacing:-.035em}
.hero h1 span{color:#0fae9f}
.loginpanel{padding:30px}
.loginpanel h2,.loginpanel h3{color:#223746}
.bubble{background:#f4f7fa;border-color:#e0e7ed;color:#263744}
.bubble.customer{background:#e5f8f5;border-color:#b7e9e2;color:#164d48}
.bubble.agent{background:#eef3f8;border-color:#dce5ed;color:#263744}
.caseitem,.listitem{background:#fff;border-color:#e1e8ee;color:var(--text)}
.caseitem:hover,.listitem:hover{background:#f8fbfc;border-color:#a9dcd6}
.caseitem.active{background:#eaf8f6;border-color:var(--teal)}
.tag{background:#e5f8f5;color:#087f75}
.tag.warn{background:#fff6df;color:#8b5c06}
.tag.red{background:#fff0f1;color:#b42332}
.tag.green{background:#e8f7ef;color:#14734f}
.quick button{background:#fff;color:#087f75;border-color:#cfe8e4}
.quick button:hover{background:#eaf8f6}
td,th{border-bottom-color:#e6ecf1}
th{color:#617384}
.toast{background:#fff;color:#263744;border-color:#9bded6;box-shadow:0 8px 28px rgba(23,43,58,.14)}
.notice{background:#fff8e8;border-color:#f0d99c;color:#805b12}
.empty{color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(25,191,174,.35);outline-offset:2px}
@media(max-width:850px){.loginwrap{gap:24px}.loginpanel{padding:22px}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px;backdrop-filter:blur(3px)}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:850px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 45px rgba(0,0,0,.22)}
.modal-body{overflow:auto;padding:20px;flex:1;white-space:pre-wrap;font-family:monospace;font-size:13px;line-height:1.6;background:#f8fafc;border-radius:10px;border:1px solid var(--line);margin:16px 20px}
.kb-tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.kb-tab-btn{background:transparent;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.kb-tab-btn.active{background:#e8f8f6;color:var(--teal)}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;background:#fbfdfe;cursor:pointer;transition:.2s}
.dropzone:hover{border-color:var(--teal);background:#f0faf8}

</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const API='http://127.0.0.1:8000';let token=localStorage.getItem('vteki_token')||'',me=null,tab='chat',cases=[],activeCase=null,messages=[],kb=[],notifications=[],dashboard=null,approvals=[],auditRows=[],busy=false,kbFilter='all',reviewingDoc=null,kbUploadTab='upload',chosenFileText='',chosenFileName='';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+'/api'+path,{...opts,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Permintaan gagal ('+r.status+')');return d}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),3200)}
function btn(label,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function loginView(){ $('#app').innerHTML=`<div class="loginwrap"><section class="hero"><div class="logo">V-TEKI <span>Workspace</span></div><p class="sub">CUSTOMER SERVICE · AI-ASSISTED OPERATIONS</p><h1>Layanan pelanggan yang <span>cerdas</span>, terukur, dan terkendali.</h1><p class="muted">Gemini AI membantu menjawab pertanyaan berdasarkan Basis Pengetahuan. Permintaan berisiko tetap memerlukan tinjauan manusia.</p><div class="tag">Gemini API</div><div class="tag">Knowledge Base / RAG sederhana</div><div class="tag">Role-based access</div></section><form class="loginpanel" onsubmit="doLogin(event)"><h2>Masuk ke workspace</h2><p class="muted">Gunakan akun demo untuk mencoba dashboard.</p><div class="formrow"><label>Email</label><input id="email" class="field" type="email" required value="customer@vteki.id"></div><div class="formrow"><label>Kata sandi</label><input id="password" class="field" type="password" required value="cust1234"></div><button class="btn" style="width:100%">Masuk</button><div class="demo"><button type="button" class="btn secondary" onclick="fillDemo('customer')">Isi akun Customer</button><button type="button" class="btn secondary" onclick="fillDemo('admin')">Isi akun Admin</button></div><p class="sub" style="margin-top:16px">Akun demo: admin@vteki.id / admin123 · customer@vteki.id / cust1234</p></form></div>`}
function fillDemo(role){$('#email').value=role==='admin'?'admin@vteki.id':'customer@vteki.id';$('#password').value=role==='admin'?'admin123':'cust1234'}
async function doLogin(e){e.preventDefault();try{const d=await req('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=d.access_token;me=d.user;localStorage.setItem('vteki_token',token);tab=me.role==='admin'?'dashboard':'chat';await loadTab();render()}catch(e){toast(e.message)}}
async function logout(){try{await req('/auth/logout',{method:'POST'})}catch{}token='';me=null;localStorage.removeItem('vteki_token');render()}
function shell(content){const admin=me.role==='admin';const nav=admin?[['dashboard','Dasbor'],['cases','Kasus & Percakapan'],['approvals','Persetujuan'],['knowledge','Basis Pengetahuan'],['audit','Audit Trail']]:[['chat','Chat'],['notifications','Notifikasi']];return `<div class="shell"><header class="top"><div><div class="logo">V-TEKI <span>Workspace</span></div><div class="sub">Layanan Pelanggan AI Agentik · Gemini</div></div><div class="userline"><span class="pill">${admin?'ADMIN':'CUSTOMER'}</span><span>${esc(me.name)}</span><button class="btn secondary" onclick="logout()">Keluar</button></div></header><nav class="nav">${nav.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav>${content}<div class="footer">V-TEKI Workspace · Prototype akademik. Tidak terhubung ke sistem bank atau transaksi nyata.</div></div>`}
async function go(t){tab=t;try{await loadTab();render()}catch(e){toast(e.message)}}
async function loadTab(){if(!me)return;if(tab==='chat'||tab==='cases'){cases=(await req('/cases')).items;if(tab==='chat'&&!activeCase&&cases.length)activeCase=cases[0].id;if(tab==='cases'&&!activeCase&&cases.length)activeCase=cases[0].id;if(activeCase&&cases.some(c=>c.id===activeCase)){messages=(await req('/cases/'+encodeURIComponent(activeCase)+'/messages')).items}else messages=[]}if(tab==='dashboard')dashboard=await req('/admin/dashboard');if(tab==='knowledge')kb=(await req('/knowledge')).items;if(tab==='notifications')notifications=(await req('/notifications')).items;if(tab==='approvals')approvals=(await req('/admin/approvals')).items;if(tab==='audit')auditRows=(await req('/admin/audit')).items}
function pagehead(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function render(){if(!me){loginView();return}let body='';if(tab==='dashboard')body=dashboardView();else if(tab==='chat')body=chatView(false);else if(tab==='cases')body=chatView(true);else if(tab==='knowledge')body=knowledgeView();else if(tab==='notifications')body=notificationsView();else if(tab==='approvals')body=approvalsView();else if(tab==='audit')body=auditView();$('#app').innerHTML=shell(body)}
function dashboardView(){const d=dashboard||{statuses:{}};return pagehead('Dasbor','Ringkasan operasional customer service AI.')+`<div class="grid">${[['Total kasus',d.total_cases||0],['Menunggu agen',d.statuses?.['Menunggu agen']||0],['Menunggu persetujuan',d.statuses?.['Menunggu persetujuan']||0],['Artikel KB aktif',d.active_knowledge_articles||0]].map(([l,v])=>`<div class="panel"><div class="metric">${v}</div><div class="metriclabel">${l}</div></div>`).join('')}</div><div class="grid2" style="margin-top:14px"><div class="panel"><h3 class="sectiontitle">Konfigurasi model</h3><p>Model: <b>${esc(d.model)}</b></p><p>Status API: <span class="tag ${d.gemini_configured?'green':'warn'}">${d.gemini_configured?'API key terpasang':'API key belum diatur'}</span></p><p class="muted">Kunci API disimpan di backend, bukan browser.</p></div><div class="panel"><h3 class="sectiontitle">Aktivitas terbaru</h3>${(d.recent_audit||[]).map(a=>`<div class="listitem"><b>${esc(a.action)}</b><div class="sub">${esc(a.user_email)} · ${esc(a.created_at)}</div></div>`).join('')||'<div class="empty">Belum ada aktivitas.</div>'}</div></div>`}
function chatView(admin){const title=admin?'Kasus & Percakapan':'Chat';const desc=admin?'Pilih kasus untuk melihat riwayat. Agen dapat menyetujui atau menutup kasus melalui alur operasional.':'Tanyakan informasi layanan. Jawaban AI dibatasi oleh artikel Basis Pengetahuan aktif.';const left=`<div class="panel"><h3 class="sectiontitle">${admin?'Semua kasus':'Percakapan Anda'}</h3>${btn('+ Percakapan baru','newCase()','btn secondary')}${cases.map(c=>`<div class="caseitem ${c.id===activeCase?'active':''}" onclick="selectCase('${c.id}')"><b>${esc(c.id)}</b><div>${esc(c.subject||'Percakapan baru')}</div><span class="tag ${c.status==='Menunggu persetujuan'?'red':c.status==='Menunggu agen'?'warn':'green'}">${esc(c.status)}</span>${admin?`<div class="sub">${esc(c.customer_name||c.customer_email||'')}</div>`:''}</div>`).join('')||'<div class="empty">Belum ada percakapan.</div>'}</div>`;const right=`<div class="panel chatbox"><div class="sectiontitle">${esc(activeCase||'Percakapan baru')} ${activeCase&&cases.find(c=>c.id===activeCase)?`<span class="tag">${esc(cases.find(c=>c.id===activeCase).status)}</span>`:''}</div><div id="messages" class="messages">${messages.map(m=>`<div class="bubble ${esc(m.sender)}"><div class="sender">${m.sender==='customer'?'Anda':m.sender==='agent'?'Agen CS':'Asisten AI'} · ${esc(m.created_at||'')}</div>${esc(m.content)}</div>`).join('')||'<div class="empty">Mulai percakapan dengan mengirim pertanyaan.</div>'}</div>${!admin?`<div class="quick">${['Bicara dengan admin','Nomor resmi Halo BCA?','Apa bedanya myBCA dan BCA mobile?','Bagaimana cara memblokir kartu hilang?'].map(q=>`<button onclick="quickSend('${esc(q)}')">${esc(q)}</button>`).join('')}</div>`:''}<form class="sendrow" onsubmit="sendMessage(event)"><input id="message" class="field" placeholder="${admin?'Balas sebagai agen CS…':'Tulis pesan…'}" maxlength="4000" ${busy?'disabled':''}><button class="btn" ${busy?'disabled':''}>${busy?'Memproses…':'Kirim'}</button></form><div class="sub" style="margin-top:8px">Jangan kirim PIN, OTP, kata sandi, atau data kartu lengkap.</div></div>`;return pagehead(title,desc)+`<div class="grid2">${left}${right}</div>`}
async function selectCase(id){activeCase=id;messages=(await req('/cases/'+encodeURIComponent(id)+'/messages')).items;render()}
async function newCase(){try{const d=await req('/cases',{method:'POST',body:JSON.stringify({subject:'Percakapan baru'})});activeCase=d.case_id;messages=d.messages||[];cases=(await req('/cases')).items;render()}catch(e){toast(e.message)}}
function quickSend(q){$('#message').value=q;$('#message').focus()}
async function sendMessage(e){e.preventDefault();const input=$('#message');const message=input.value.trim();if(!message||busy)return;busy=true;render();try{if(me.role==='admin'){if(!activeCase)throw new Error('Pilih kasus terlebih dahulu.');await req('/admin/cases/'+encodeURIComponent(activeCase)+'/reply',{method:'POST',body:JSON.stringify({message})});toast('Balasan agen dikirim.')}else{const d=await req('/chat',{method:'POST',body:JSON.stringify({message,case_id:activeCase})});activeCase=d.case_id;toast('Pesan diproses · '+d.status)}cases=(await req('/cases')).items;messages=(await req('/cases/'+encodeURIComponent(activeCase)+'/messages')).items}catch(err){toast(err.message)}finally{busy=false;render();const inp=$('#message');if(inp)inp.focus()}}
function setKbFilter(f){ kbFilter = f; render(); }
function setKbUploadTab(t){ kbUploadTab = t; render(); }
function openReviewModal(id){ reviewingDoc = kb.find(x => x.id === id); render(); }
function closeReviewModal(e){ reviewingDoc = null; render(); }

function onFileChosen(e){
  const file = e.target.files[0];
  if(!file) return;
  chosenFileName = file.name;
  const label = $('#fileChosenLabel');
  if(label) label.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB)';
  const upTitle = $('#upTitle');
  if(upTitle) upTitle.value = file.name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
  const reader = new FileReader();
  reader.onload = function(evt){
    chosenFileText = evt.target.result;
    toast('Berkas terbaca: ' + chosenFileText.length.toLocaleString() + ' karakter');
  };
  reader.readAsText(file);
}

async function submitFileUpload(){
  if(!chosenFileText.trim()){
    return toast('Pilih berkas teks (.txt, .md, .json) terlebih dahulu.');
  }
  const title = ($('#upTitle').value || chosenFileName || 'Dokumen Upload').trim();
  const status = $('#upStatus').value || 'Draf';
  try {
    await req('/knowledge/upload-file', {
      method: 'POST',
      body: JSON.stringify({
        title: title,
        filename: chosenFileName,
        body: chosenFileText,
        category: 'Dokumen',
        status: status
      })
    });
    kb = (await req('/knowledge')).items;
    chosenFileText = '';
    chosenFileName = '';
    toast('Dokumen berhasil diunggah dengan status: ' + status);
    render();
  } catch(err){
    toast(err.message);
  }
}

async function activateExclusiveKnowledge(id){
  const item = kb.find(x => x.id === id);
  const name = item ? item.title : id;
  if(!confirm('Jadikan "' + name + '" sebagai SATU-SATUNYA knowledge aktif?\nDokumen knowledge lainnya akan otomatis dialihkan ke status Draf.')) return;
  try {
    await req('/knowledge/' + id + '/activate-exclusive', { method: 'POST' });
    kb = (await req('/knowledge')).items;
    toast('AI sekarang aktif menggunakan: ' + name);
    render();
  } catch(err){
    toast(err.message);
  }
}

function renderReviewModal(k){
  const wordCount = k.body.trim().split(/\s+/).length;
  return `
  <div class="modal-overlay" onclick="reviewingDoc=null;render()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <div>
          <h2 style="margin:0;font-size:18px">${esc(k.title)}</h2>
          <div class="sub">ID: KB-${k.id} · Kategori: <b>${esc(k.category)}</b> · Status: <span class="tag ${k.status==='Aktif'?'green':'warn'}">${esc(k.status==='Aktif'?'Aktif (Live di AI)':'Draf (Perlu Tinjauan)')}</span></div>
        </div>
        <button class="btn secondary" onclick="reviewingDoc=null;render()">✕ Tutup</button>
      </div>
      <div class="modal-body">${esc(k.body)}</div>
      <div style="padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="sub">Panjang: ${k.body.length.toLocaleString()} karakter (~${wordCount.toLocaleString()} kata)</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${k.status !== 'Aktif' ? `<button class="btn" onclick="toggleKnowledge(${k.id},'Aktif');reviewingDoc=null">✅ Setujui & Aktifkan untuk AI</button>` : `<button class="btn secondary" onclick="toggleKnowledge(${k.id},'Draf');reviewingDoc=null">⏸️ Nonaktifkan (Jadikan Draf)</button>`}
          <button class="btn" style="background:#0b534d" onclick="activateExclusiveKnowledge(${k.id});reviewingDoc=null">⚡ Jadikan Knowledge Utama Saja</button>
        </div>
      </div>
    </div>
  </div>`;
}

    if (kbFilter==='draft') return k.status==='Draf';

    </div>

      <div class="metriclabel">Dokumen Aktif (Live di AI)</div>
    </div>

      <div class="metric" style="color:#b45309">${draftCount}</div>
      <div class="metriclabel">Draf / Menunggu Tinjauan</div>
    </div>
    <div class="panel">
      <div class="metriclabel">Knowledge Live yang Dipakai AI:</div>

        <button class="kb-tab-btn ${kbUploadTab==='paste'?'active':''}" onclick="setKbUploadTab('paste')">📋 Tempel Teks</button>
        <button class="kb-tab-btn ${kbUploadTab==='form'?'active':''}" onclick="setKbUploadTab('form')">✍️ Form Manual</button>
      </div>

      ${kbUploadTab==='upload' ? `
        <h3 class="sectiontitle">Unggah Dokumen Baru</h3>
        <p class="sub">Mendukung berkas teks (.txt, .md, .json, .csv). Dokumen otomatis dianalisis dan siap ditinjau.</p>
        <div class="dropzone" onclick="$('#fileInput').click()">

        </div>
        <div class="formrow" style="margin-top:12px">
          <label>Judul Dokumen (Opsional)</label>
          <input id="upTitle" class="field" placeholder="Judul otomatis diambil dari file/heading...">
        </div>
        <div class="formrow">
          <label>Status Awal</label>
          <select id="upStatus" class="field">
            <option value="Draf" selected>Draf (Perlu Peninjauan Admin terlebih dahulu)</option>
            <option value="Aktif">Aktif (Langsung dipakai oleh AI Gemini)</option>
          </select>
        </div>
        <button class="btn" style="width:100%;margin-top:8px" onclick="submitFileUpload()">Unggah & Simpan Dokumen</button>
      ` : kbUploadTab==='paste' ? `
        <h3 class="sectiontitle">Tempel Teks Dokumen Cepat</h3>
        <p class="sub">Tempel dokumen panjang (SOP, FAQ, kebijakan, panduan bank) hingga 100.000 karakter.</p>
        <div class="formrow"><label>Judul Dokumen</label><input id="importtitle" class="field" placeholder="Contoh: Panduan Layanan Bank 2026"></div>
        <div class="formrow"><label>Isi Dokumen</label><textarea id="importbody" class="field" style="min-height:160px" placeholder="Tempel seluruh isi teks dokumen di sini..."></textarea></div>
        <div class="formrow">
          <label>Status Dokumen</label>

            <option value="Draf">Draf (Simpan untuk ditinjau dulu)</option>
            <option value="Aktif" selected>Aktif (Langsung aktif dipakai AI)</option>
          </select>

        <button class="btn secondary" style="width:100%" onclick="importText()">Simpan Dokumen</button>

      <input class="field" placeholder="🔍 Cari dokumen atau kata kunci..." oninput="filterKb(this.value)">
      <div id="kbrows" style="margin-top:12px">${kbRows(filteredItems)}</div>
    </div>
  </div>

  ${reviewingDoc ? renderReviewModal(reviewingDoc) : ''}
  `;
}

function kbRows(items){
  return items.map(k=>`
    <div class="listitem" style="border-left: 4px solid ${k.status==='Aktif'?'#19bfae':'#d97706'}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <b>${esc(k.title)}</b>
        <span class="tag ${k.status==='Aktif'?'green':'warn'}">${esc(k.status==='Aktif'?'Aktif (Live di AI)':'Draf (Perlu Tinjauan)')}</span>
      </div>
      <div class="sub">KB-${k.id} · ${esc(k.category)} · ${k.body.length.toLocaleString()} karakter · Diperbarui: ${esc(k.updated_at||'')}</div>
      <p style="margin:6px 0">${esc(k.body.slice(0,180))}${k.body.length>180?'…':''}</p>
      <div class="actions" style="margin-top:8px">
        <button class="btn secondary" onclick="openReviewModal(${k.id})">🔍 Tinjau Lengkap</button>
        <button class="btn secondary" onclick="toggleKnowledge(${k.id},'${k.status==='Aktif'?'Draf':'Aktif'}')">
          ${k.status==='Aktif'?'⏸️ Jadikan Draf':'✅ Setujui & Aktifkan'}
        </button>
        <button class="btn" style="background:#0b534d" onclick="activateExclusiveKnowledge(${k.id})" title="Menonaktifkan knowledge lain dan menjadikan dokumen ini satu-satunya yang aktif">
          ⚡ Jadikan Knowledge Utama
        </button>
        <button class="btn secondary" onclick="editKnowledge(${k.id})">✏️ Edit</button>
        <button class="btn danger" onclick="deleteKnowledge(${k.id})">🗑️</button>
      </div>
    </div>
  `).join('') || '<div class="empty">Tidak ada dokumen pada filter ini.</div>';
}

function filterKb(q){
  const filtered = kb.filter(k=>{
    const matchQ = (k.title+' '+k.body+' '+(k.keywords||'')).toLowerCase().includes(q.toLowerCase());
    if(!matchQ) return false;
    if(kbFilter==='active') return k.status==='Aktif';
    if(kbFilter==='draft') return k.status==='Draf';
    return true;
  });
  $('#kbrows').innerHTML = kbRows(filtered);
}

async function saveKnowledge(e){
  e.preventDefault();
  try{
    await req('/knowledge',{
      method:'POST',
      body:JSON.stringify({
        title:$('#ktitle').value,
        category:$('#kcat').value,
        keywords:$('#kkeywords').value,
        body:$('#kbody').value,
        status:$('#kstatus').value
      })
    });
    kb=(await req('/knowledge')).items;
    render();
    toast('Artikel tersimpan.');
  }catch(e){toast(e.message)}
}

function editKnowledge(id){
  const k=kb.find(x=>x.id===id);
  if(!k)return;
  setKbUploadTab('form');
  setTimeout(()=>{
    $('#ktitle').value=k.title;
    $('#kcat').value=k.category;
    $('#kkeywords').value=k.keywords||'';
    $('#kbody').value=k.body;
    $('#kstatus').value=k.status;
    const f=$('form[onsubmit="saveKnowledge(event)"]');
    if(!f) return;
    f.onsubmit=async e=>{
      e.preventDefault();
      try{
        await req('/knowledge/'+id,{
          method:'PUT',
          body:JSON.stringify({
            title:$('#ktitle').value,
            category:$('#kcat').value,
            keywords:$('#kkeywords').value,
            body:$('#kbody').value,
            status:$('#kstatus').value
          })
        });
        kb=(await req('/knowledge')).items;
        render();
        toast('Artikel diperbarui.');
      }catch(err){toast(err.message)}
    };
    f.querySelector('button').textContent='Simpan Perubahan';
    $('#ktitle').focus();
  },50);
}

async function toggleKnowledge(id,status){
  const k=kb.find(x=>x.id===id);
  try{
    await req('/knowledge/'+id,{
      method:'PUT',
      body:JSON.stringify({...k,status})
    });
    kb=(await req('/knowledge')).items;
    render();
    toast('Status diubah ke: '+status);
  }catch(e){toast(e.message)}
}

async function deleteKnowledge(id){
  if(!confirm('Hapus dokumen/artikel ini?'))return;
  try{
    await req('/knowledge/'+id,{method:'DELETE'});
    kb=(await req('/knowledge')).items;
    render();
    toast('Dokumen dihapus.');
  }catch(e){toast(e.message)}
}

async function importText(){
  const body=$('#importbody').value.trim();
  if(!body)return toast('Isi dokumen masih kosong.');
  const title=$('#importtitle').value.trim()||'Dokumen impor';
  const status=$('#pasteStatus')?$('#pasteStatus').value:'Aktif';
  try{
    await req('/knowledge/import-text',{
      method:'POST',
      body:JSON.stringify({title,body,status})
    });
    kb=(await req('/knowledge')).items;
    render();
    toast('Dokumen berhasil disimpan dengan status: '+status);
  }catch(e){toast(e.message)}
}

function auditView(){return pagehead('Audit Trail','Catatan aktivitas terbaru.')+`<div class="panel tablewrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th></tr></thead><tbody>${auditRows.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user_email)}</td><td>${esc(a.action)}</td></tr>`).join('')}</tbody></table></div>`}
(async function init(){if(!token){render();return}try{const d=await req('/auth/me');me=d.user;tab=me.role==='admin'?'dashboard':'chat';await loadTab();render()}catch{token='';localStorage.removeItem('vteki_token');render()}})();
</script></body></html>
