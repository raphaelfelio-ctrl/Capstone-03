<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V-TEKI Workspace</title>
  <style>
    :root {
      --bg: #f4f7fa;
      --panel: #fff;
      --panel2: #f8fbfc;
      --line: #e1e8ee;
      --text: #1d2935;
      --muted: #667786;
      --teal: #19bfae;
      --teal-d: #087f75;
      --gold: #a86a08;
      --red: #d9434e;
      --green: #16865f;
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    html {
      background: var(--bg)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, Segoe UI, Arial, sans-serif
    }

    button,
    input,
    textarea,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .hidden {
      display: none !important
    }

    .shell {
      max-width: 1400px;
      margin: auto;
      padding: 22px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      flex-wrap: wrap;
      box-shadow: 0 2px 12px rgba(23, 43, 58, .045)
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #233442
    }

    .logo span {
      color: var(--teal)
    }

    .sub {
      color: var(--muted);
      font-size: 12px
    }

    .userline {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 11px;
      background: #f8fafc;
      color: #526575
    }

    .btn {
      border: 1px solid var(--teal);
      border-radius: 10px;
      padding: 9px 14px;
      background: var(--teal);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(18, 75, 71, .08)
    }

    .btn:hover {
      filter: brightness(.97)
    }

    .btn.secondary {
      background: #fff;
      color: #344655;
      border-color: #d7e1e8
    }

    .btn.secondary:hover {
      background: #f4faf9;
      border-color: #9bded6
    }

    .btn.danger {
      background: #fff1f2;
      color: #b42332;
      border-color: #f2c6cb
    }

    .btn.small {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin: 16px 0
    }

    .nav button {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      color: #536574;
      white-space: nowrap;
      position: relative
    }

    .nav button:hover {
      background: #f3faf9;
      border-color: #a9e1db
    }

    .nav button.active {
      background: #e8f8f6;
      border-color: #8ddbd2;
      color: var(--teal-d)
    }

    .badge {
      display: inline-block;
      min-width: 18px;
      padding: 0 6px;
      margin-left: 6px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center
    }

    .pagehead {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin: 24px 0 16px;
      flex-wrap: wrap
    }

    .pagehead h1 {
      font-size: 26px;
      margin: 0
    }

    .pagehead p {
      margin: 4px 0 0;
      color: var(--muted)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px
    }

    .grid2 {
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.4fr);
      gap: 14px
    }

    .grid2.kb {
      grid-template-columns: minmax(300px, .85fr) minmax(0, 1.4fr)
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 18px;
      min-width: 0;
      box-shadow: 0 3px 14px rgba(23, 43, 58, .045)
    }

    .panel+.panel {
      margin-top: 14px
    }

    .metric {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.04em;
      margin: 6px 0;
      color: #1c3443
    }

    .metriclabel {
      color: var(--muted)
    }

    .sectiontitle {
      font-weight: 750;
      font-size: 15px;
      margin: 0 0 12px
    }

    .muted {
      color: var(--muted)
    }

    .formrow {
      display: grid;
      gap: 6px;
      margin: 10px 0
    }

    .formrow label {
      color: var(--muted);
      font-size: 12px
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 10px
    }

    .field {
      width: 100%;
      background: #fff;
      border: 1px solid #d7e1e8;
      border-radius: 10px;
      padding: 10px 11px;
      color: var(--text);
      outline: none
    }

    .field::placeholder {
      color: #95a3af
    }

    .field:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(25, 191, 174, .12)
    }

    textarea.field {
      resize: vertical;
      min-height: 100px
    }

    .loginwrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 56px;
      align-items: center;
      max-width: 1160px;
      margin: auto;
      padding: 40px
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.08;
      margin: 20px 0;
      color: #203443;
      letter-spacing: -.035em
    }

    .hero h1 span {
      color: #0fae9f
    }

    .loginpanel {
      padding: 30px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 3px 14px rgba(23, 43, 58, .045)
    }

    .demo {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .chatbox {
      height: 62vh;
      min-height: 360px;
      max-height: 720px;
      display: flex;
      flex-direction: column
    }

    .messages {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 3px
    }

    .bubble {
      max-width: 82%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid #e0e7ed;
      border-radius: 14px;
      padding: 11px 14px;
      background: #f4f7fa;
      color: #263744
    }

    .bubble.customer {
      align-self: flex-end;
      background: #e5f8f5;
      border-color: #b7e9e2;
      color: #164d48
    }

    .bubble.agent {
      align-self: flex-start;
      background: #eef3f8;
      border-color: #dce5ed
    }

    .bubble.assistant {
      align-self: flex-start
    }

    .bubble.system {
      align-self: center;
      max-width: 92%;
      background: #f6f8fa;
      border-style: dashed;
      color: #4c5d6b;
      font-size: 13px
    }

    .bubble.warning {
      align-self: center;
      max-width: 92%;
      background: #fff0f1;
      border: 1px solid #f2c6cb;
      color: #8f1d2a
    }

    .bubble.flagged {
      border-color: #f2c6cb;
      background: #fff7f7;
      color: #7a2a33
    }

    .sender {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px
    }

    .sources {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      white-space: normal
    }

    .source {
      font-size: 11px;
      border: 1px solid #cfe8e4;
      background: #fff;
      color: var(--teal-d);
      border-radius: 999px;
      padding: 3px 9px;
      text-decoration: none
    }

    .source:hover {
      background: #eaf8f6
    }

    .trace {
      margin-top: 6px;
      font-size: 11px;
      color: #8193a1;
      white-space: normal;
      font-family: ui-monospace, Consolas, monospace
    }

    .sendrow {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line)
    }

    .sendrow input {
      flex: 1;
      min-width: 0
    }

    .caseitem,
    .listitem {
      padding: 12px;
      border: 1px solid #e1e8ee;
      border-radius: 12px;
      margin: 8px 0;
      background: #fff
    }

    .caseitem {
      cursor: pointer
    }

    .caseitem:hover,
    .listitem.clickable:hover {
      background: #f8fbfc;
      border-color: #a9dcd6
    }

    .caseitem.active,
    .listitem.active {
      background: #eaf8f6;
      border-color: var(--teal)
    }

    .listitem.clickable {
      cursor: pointer
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5f8f5;
      color: var(--teal-d);
      font-size: 11px;
      margin: 3px 3px 3px 0;
      white-space: nowrap
    }

    .tag.warn {
      background: #fff6df;
      color: #8b5c06
    }

    .tag.red {
      background: #fff0f1;
      color: #b42332
    }

    .tag.green {
      background: #e8f7ef;
      color: #14734f
    }

    .tag.gray {
      background: #eef2f5;
      color: #5c6d7b
    }

    .tag.blue {
      background: #eaf1fd;
      color: #2b55a3
    }

    .tablewrap {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 560px
    }

    td,
    th {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid #e6ecf1;
      vertical-align: top
    }

    th {
      color: #617384;
      font-weight: 600
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: #fff;
      color: #263744;
      border: 1px solid #9bded6;
      border-radius: 999px;
      max-width: 90vw;
      z-index: 20;
      box-shadow: 0 8px 28px rgba(23, 43, 58, .14)
    }

    .notice {
      padding: 12px;
      border: 1px solid #f0d99c;
      background: #fff8e8;
      color: #805b12;
      border-radius: 12px;
      margin-bottom: 12px
    }

    .notice.red {
      border-color: #f2c6cb;
      background: #fff0f1;
      color: #8f1d2a
    }

    .empty {
      color: var(--muted);
      padding: 20px;
      text-align: center
    }

    .quick {
      display: flex;
      gap: 6px;
      overflow: auto;
      padding: 8px 0
    }

    .quick button {
      border: 1px solid #cfe8e4;
      background: #fff;
      color: var(--teal-d);
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap
    }

    .quick button:hover {
      background: #eaf8f6
    }

    .footer {
      margin: 20px 0;
      color: var(--muted);
      font-size: 11px
    }

    .drop {
      display: block;
      cursor: pointer;
      border: 2px dashed #bfe3de;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      background: #f6fcfb;
      color: #4c6b70;
      transition: .15s
    }

    .drop.over {
      background: #e5f8f5;
      border-color: var(--teal)
    }

    .drop b {
      color: var(--teal-d)
    }

    .filelist {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      font-size: 13px
    }

    .filelist li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px dashed var(--line)
    }

    .result {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
      margin: 6px 0;
      background: #f4f7fa
    }

    .result.ok {
      background: #e8f7ef;
      color: #14734f
    }

    .result.err {
      background: #fff0f1;
      color: #b42332
    }

    .result.same {
      background: #eef2f5;
      color: #5c6d7b
    }

    .chunk {
      padding: 11px 12px;
      border: 1px solid #e6ecf1;
      border-radius: 11px;
      margin: 7px 0;
      background: #fff
    }

    .chunk.off {
      opacity: .62;
      background: #fafbfc
    }

    .chunk p {
      margin: 6px 0;
      color: #405160;
      font-size: 13px;
      white-space: pre-wrap
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap
    }

    .score {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #405160
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0;
      width: min(760px, 94vw);
      box-shadow: 0 20px 60px rgba(23, 43, 58, .25)
    }

    dialog::backdrop {
      background: rgba(20, 35, 45, .35)
    }

    .dialoghead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line)
    }

    .dialogbody {
      padding: 6px 18px 18px;
      max-height: 72vh;
      overflow: auto
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0
    }

    .filters .field {
      width: auto;
      flex: 1;
      min-width: 140px;
      padding: 7px 10px
    }

    details summary {
      cursor: pointer;
      font-weight: 700;
      color: #344655
    }

    hr.sep {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 18px 0
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(25, 191, 174, .35);
      outline-offset: 2px
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .grid2,
      .grid2.kb,
      .loginwrap {
        grid-template-columns: 1fr
      }

      .loginwrap {
        padding: 22px;
        gap: 24px
      }

      .hero h1 {
        font-size: 34px
      }

      .shell {
        padding: 12px
      }

      .chatbox {
        height: 58vh
      }
    }

    @media(max-width:480px) {
      .grid {
        grid-template-columns: 1fr 1fr
      }

      .panel {
        padding: 13px
      }

      .bubble {
        max-width: 94%
      }

      .pagehead h1 {
        font-size: 22px
      }

      .formgrid {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <dialog id="dlg">
    <div class="dialoghead">
      <b id="dlgtitle"></b>
      <button class="btn secondary small" onclick="closeDlg()">Tutup</button>
    </div>
    <div id="dlgbody" class="dialogbody"></div>
  </dialog>

  <script>
    const API = 'http://127.0.0.1:8000';
    let token = localStorage.getItem('vteki_token') || '', me = null, maxStrikes = 3, tab = 'chat', cases = [], activeCase = null, messages = [], notifications = [], dashboard = null, approvals = [], auditRows = [], busy = false;
    let docs = [], manualCount = 0, activeDoc = null, docChunks = [], chunkFilter = { q: '', kind: '', status: '' }, pendingFiles = [], uploadResults = [], searchResult = null, guard = { items: [], users: [] }, guardPending = 0;
    const CATS = ['Umum', 'FAQ', 'Kontak', 'Layanan Digital', 'Simpanan', 'Keamanan', 'Pengaduan', 'Kartu', 'Pinjaman', 'Biaya & Limit', 'Sumber Resmi', 'Kebijakan', 'Produk', 'Instruksi AI', 'Metadata', 'Arsip lama'];
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

    async function req(path, opts = {}) {
      const headers = {
        ...(opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
        ...(opts.headers || {})
      };
      if (token) headers.Authorization = 'Bearer ' + token;

      let r;
      try {
        r = await fetch(API + '/api' + path, { ...opts, headers });
      } catch (e) {
        throw new Error('Tidak dapat terhubung ke backend (jalankan backend di port 8000).');
      }

      let d = {};
      try { d = await r.json(); } catch { }

      if (!r.ok) {
        throw new Error(
          typeof d.detail === 'string'
            ? d.detail
            : (d.detail?.[0]?.msg || 'Permintaan gagal (' + r.status + ')')
        );
      }

      return d;
    }

    function toast(s) {
      const e = $('#toast');
      e.textContent = s;
      e.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => e.classList.add('hidden'), 3800);
    }

    function btn(label, fn, cls = 'btn') {
      return `<button class="${cls}" onclick="${fn}">${label}</button>`;
    }

    function openDlg(title, html) {
      $('#dlgtitle').textContent = title;
      $('#dlgbody').innerHTML = html;
      $('#dlg').showModal();
    }

    function closeDlg() {
      $('#dlg').close();
    }

    function statusTag(s) {
      const cls = {
        'Menunggu persetujuan': 'red',
        'Dialihkan ke admin': 'red',
        'Menunggu agen': 'warn',
        'Ditangani': 'blue',
        'Baru': 'gray',
        'Ditolak': 'gray'
      }[s] || 'green';

      return `<span class="tag ${cls}">${esc(s)}</span>`;
    }

    /* ---------------- Login & shell ---------------- */

    function loginView() {
      $('#app').innerHTML = `
        <div class="loginwrap">
            <section class="hero">
                <div class="logo">V-TEKI <span>Workspace</span></div>
                <p class="sub">CUSTOMER SERVICE · AI-ASSISTED OPERATIONS</p>
                <h1>Layanan pelanggan yang <span>cerdas</span>, terukur, dan terkendali.</h1>
                <p class="muted">Gemini AI menjawab berdasarkan Basis Pengetahuan yang Anda unggah. Routing percakapan memakai LangGraph, dan guardrail mengalihkan upaya manipulasi AI langsung ke admin.</p>
                <div class="tag">Gemini API</div>
                <div class="tag">LangGraph routing</div>
                <div class="tag">Knowledge base per bagian</div>
                <div class="tag">Guardrail anti-manipulasi</div>
            </section>

            <form class="loginpanel" onsubmit="doLogin(event)">
                <h2>Masuk ke workspace</h2>
                <p class="muted">Gunakan akun demo untuk mencoba dashboard.</p>

                <div class="formrow">
                    <label>Email</label>
                    <input id="email" class="field" type="email" required value="customer@vteki.id">
                </div>

                <div class="formrow">
                    <label>Kata sandi</label>
                    <input id="password" class="field" type="password" required value="cust1234">
                </div>

                <button class="btn" style="width:100%">Masuk</button>

                <div class="demo">
                    <button type="button" class="btn secondary" onclick="fillDemo('customer')">Isi akun Customer</button>
                    <button type="button" class="btn secondary" onclick="fillDemo('admin')">Isi akun Admin</button>
                </div>

                <p class="sub" style="margin-top:16px">Akun demo: admin@vteki.id / admin123 · customer@vteki.id / cust1234</p>
            </form>
        </div>`;
    }

    function fillDemo(role) {
      $('#email').value = role === 'admin' ? 'admin@vteki.id' : 'customer@vteki.id';
      $('#password').value = role === 'admin' ? 'admin123' : 'cust1234';
    }

    async function doLogin(e) {
      e.preventDefault();

      try {
        const d = await req('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: $('#email').value,
            password: $('#password').value
          })
        });

        token = d.access_token;
        me = d.user;
        localStorage.setItem('vteki_token', token);
        tab = me.role === 'admin' ? 'dashboard' : 'chat';

        await loadTab();
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    async function logout() {
      try {
        await req('/auth/logout', { method: 'POST' });
      } catch { }

      token = '';
      me = null;
      activeCase = null;
      localStorage.removeItem('vteki_token');
      render();
    }

    function shell(content) {
      const admin = me.role === 'admin';
      const unread = notifications.filter(n => !n.is_read).length;

      const nav = admin
        ? [
          ['dashboard', 'Dasbor'],
          ['cases', 'Kasus & Percakapan'],
          ['approvals', 'Persetujuan'],
          ['knowledge', 'Basis Pengetahuan'],
          ['guardrail', 'Guardrail', guardPending],
          ['notifications', 'Notifikasi', dashboard?.unread_notifications],
          ['audit', 'Audit Trail']
        ]
        : [
          ['chat', 'Chat'],
          ['notifications', 'Notifikasi']
        ];

      return `
        <div class="shell">
            <header class="top">
                <div>
                    <div class="logo">V-TEKI <span>Workspace</span></div>
                    <div class="sub">Layanan Pelanggan AI · Gemini + LangGraph</div>
                </div>

                <div class="userline">

    async function go(t) {
      tab = t;

      try {
        await loadTab();
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    async function refreshMe() {
      try {
        const d = await req('/auth/me');
        me = d.user;
        maxStrikes = d.max_strikes || 3;
      } catch { }
    }

    async function loadTab() {
      if (!me) return;

      if (me.role === 'admin') {
        try {
          const g = await req('/admin/guardrail?only_pending=true');
          guardPending = g.items.length;
        } catch { }
      }

      if (tab === 'chat' || tab === 'cases') {
        cases = (await req('/cases')).items;

        if (!activeCase && cases.length) activeCase = cases[0].id;

        if (activeCase && cases.some(c => c.id === activeCase)) {
          messages = (await req('/cases/' + encodeURIComponent(activeCase) + '/messages')).items;
        } else {
          messages = [];
        }

        if (tab === 'chat') await refreshMe();
      }

      if (tab === 'dashboard') dashboard = await req('/admin/dashboard');

      if (tab === 'knowledge') {
        const d = await req('/knowledge/documents');
        docs = d.items;
        manualCount = d.manual_articles;

        if (activeDoc !== null) await loadChunks(activeDoc);
      }

      if (tab === 'notifications') notifications = (await req('/notifications')).items;
      if (tab === 'approvals') approvals = (await req('/admin/approvals')).items;
      if (tab === 'audit') auditRows = (await req('/admin/audit')).items;
      if (tab === 'guardrail') guard = await req('/admin/guardrail');
    }

            ${actions}
        </div>`;
    }

    function render() {
      if (!me) {
        loginView();
        return;

      const views = {
        dashboard: dashboardView,
        chat: () => chatView(false),
        cases: () => chatView(true),
        knowledge: knowledgeView,
        notifications: notificationsView,
        approvals: approvalsView,
        audit: auditView,

      $('#app').innerHTML = shell((views[tab] || chatView)());

      if (tab === 'knowledge') bindDrop();

      const m = $('#messages');
      if (m) m.scrollTop = m.scrollHeight;
    }

    function bubble(m, admin) {
      const meta = m.meta || {};
      const kind = meta.kind || '';
      let cls = m.sender;

      if (m.sender === 'system') cls = kind === 'warning' ? 'warning' : 'system';
      if (m.sender === 'customer' && meta.flagged) cls += ' flagged';

      const who = m.sender === 'customer'
        ? (admin ? 'Customer' : 'Anda')
        : m.sender === 'agent'
          ? 'Agen CS'
          : m.sender === 'system'
            ? (kind === 'warning' ? 'Sistem Keamanan' : 'Sistem')
            : 'Asisten AI';

      const src = (meta.sources || []).length
        ? `<div class="sources">
            ${meta.sources.map(s =>
          safeUrl(s.source_url)
            ? `<a class="source" href="${esc(safeUrl(s.source_url))}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">📄 ${esc(s.title.split(' › ').pop())}</a>`
            : `<span class="source">📄 ${esc(s.title.split(' › ').pop())}</span>`
        ).join('')}
        </div>`
        : '';

      const extra = admin && m.sender === 'customer' && meta.flagged
        ? ' · <span class="tag red">ditandai manipulasi</span>'
        : '';

      const trace = admin && (meta.route || []).length
        ? `
            <div class="trace">
                rute: ${esc(meta.route.join(' → '))}
                ${meta.handoff ? ` · handoff: ${esc(meta.handoff)}` : ''}
                ${(meta.output_problems || []).length ? ` · diblok: ${esc(meta.output_problems.join(', '))}` : ''}
                ${(meta.retrieved || []).length ? `<br>knowledge: ${esc(meta.retrieved.map(r => 'KB-' + r.id + ' (' + r.score + ')').join(', '))}` : ''}
            </div>
        `
        : '';

      return `
        <div class="bubble ${cls}">
            <div class="sender">${who} · ${esc(m.created_at || '')}${extra}</div>
            ${esc(m.content)}
            ${src}
            ${trace}
        </div>`;
    }

        <div class="panel chatbox" style="margin-top:0">

    async function selectCase(id) {
      activeCase = id;

      try {
        messages = (await req('/cases/' + encodeURIComponent(id) + '/messages')).items;
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    async function newCase() {
      try {
        const d = await req('/cases', {
          method: 'POST',
          body: JSON.stringify({ subject: 'Percakapan baru' })
        });

        activeCase = d.case_id;
        messages = d.messages || [];
        cases = (await req('/cases')).items;
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    function quickSend(q) {
      $('#message').value = q;
      $('#message').focus();
    }

    async function sendMessage(e) {
      e.preventDefault();

      const input = $('#message');
      const message = input.value.trim();

      if (!message || busy) return;

      busy = true;
      render();

      try {
        if (me.role === 'admin') {
          if (!activeCase) throw new Error('Pilih kasus terlebih dahulu.');

          await req('/admin/cases/' + encodeURIComponent(activeCase) + '/reply', {
            method: 'POST',
            body: JSON.stringify({ message })
          });

          toast('Balasan agen dikirim.');
        } else {
          const cur = cases.find(c => c.id === activeCase);
          const caseId = cur && !['Selesai', 'Ditolak'].includes(cur.status) ? activeCase : null;

          const d = await req('/chat', {
            method: 'POST',
            body: JSON.stringify({
              message,
              case_id: caseId
            })
          });

          activeCase = d.case_id;
          me.guardrail_strikes = d.strikes;
          me.ai_suspended = d.ai_suspended ? 1 : 0;
          maxStrikes = d.max_strikes || maxStrikes;

          if (d.warning) {
            toast(`⚠️ Peringatan ${Math.min(d.strikes, d.max_strikes)}/${d.max_strikes}: percakapan dialihkan ke admin.`);
          } else if (d.masked?.length) {
            toast('🔒 Data rahasia dalam pesan Anda telah disamarkan.');
          } else {
            toast('Pesan diproses · ' + d.status);
          }
        }

        cases = (await req('/cases')).items;
        messages = (await req('/cases/' + encodeURIComponent(activeCase) + '/messages')).items;
      } catch (err) {
        toast(err.message);
      } finally {
        busy = false;
        render();

        const inp = $('#message');
        if (inp) inp.focus();
      }
    }

    async function unlockAI(id) {
      try {
        await req('/admin/cases/' + encodeURIComponent(id) + '/unlock-ai', { method: 'POST' });
        toast('AI diaktifkan kembali untuk kasus ini.');
        await loadTab();
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    async function resolveCase(id) {
      if (!confirm('Tandai kasus ' + id + ' selesai?')) return;

      try {
        await req('/admin/cases/' + encodeURIComponent(id) + '/resolve', { method: 'POST' });
        await loadTab();
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    function refreshChunks() {

      el.innerHTML = docChunks.filter(k =>
        (!f.kind || k.kind === f.kind) &&
        (!f.status || k.status === f.status) &&
        (!f.q || (k.title + ' ' + k.body + ' ' + k.keywords).toLowerCase().includes(f.q.toLowerCase()))

    function readArticle(p) {
      return {
        title: $('#' + p + 'title').value.trim(),
        category: $('#' + p + 'cat').value,
        kind: $('#' + p + 'kind').value,
        status: $('#' + p + 'status').value,
        validity: $('#' + p + 'validity').value,
        source_url: $('#' + p + 'src').value.trim(),
        keywords: $('#' + p + 'kw').value.trim(),
        body: $('#' + p + 'body').value.trim()
      };

    function bindDrop() {
      const d = $('#drop');
      if (!d) return;

      ['dragenter', 'dragover'].forEach(ev =>
        d.addEventListener(ev, e => {
          e.preventDefault();
          d.classList.add('over');
        })
      );

      ['dragleave', 'drop'].forEach(ev =>
        d.addEventListener(ev, e => {
          e.preventDefault();
          d.classList.remove('over');
        })
      );

      d.addEventListener('drop', e => pickFiles(e.dataTransfer.files));
    }

    function pickFiles(list) {
      const ok = /\.(md|markdown|txt|pdf|docx)$/i;

      for (const f of list) {
        if (!ok.test(f.name)) {
          toast('Format ' + f.name + ' tidak didukung.');
          continue;
        }

        if (!pendingFiles.some(x => x.name === f.name && x.size === f.size)) {
          pendingFiles.push(f);
        }
      }

      uploadResults = [];
      render();
    }

    function removeFile(i) {
      pendingFiles.splice(i, 1);
      render();
    }

    async function uploadFiles() {
      if (!pendingFiles.length) return;

      const fd = new FormData();
      pendingFiles.forEach(f => fd.append('files', f));
      fd.append('status', $('#upstatus').value);
      fd.append('mode', $('#upmode').value);
      fd.append('category', $('#upcat').value);

      busy = true;
      render();

      try {
        const r = await req('/knowledge/upload', { method: 'POST', body: fd });
        uploadResults = r.results;
        pendingFiles = [];

        const okDoc = r.results.find(x => x.document_id);
        const d = await req('/knowledge/documents');

        docs = d.items;
        manualCount = d.manual_articles;

        if (okDoc) await loadChunks(okDoc.document_id);

        toast('Unggah selesai.');
      } catch (e) {
        toast(e.message);
      } finally {
        busy = false;
        render();
      }
    }

    async function previewFile() {
      const fd = new FormData();
      fd.append('file', pendingFiles[0]);

      try {
        const p = await req('/knowledge/preview', { method: 'POST', body: fd });

        openDlg(
          'Pratinjau: ' + p.title,
          `
                <p class="sub">
                    ${p.chunks.length} bagian · tipe ${esc(p.file_type)}
                    ${p.checked_at ? ' · tanggal dokumen ' + esc(p.checked_at) : ''}
                    ${p.existing ? ` · <b>nama file sama dengan KD-${p.existing.id} (v${p.existing.version})</b> — mode “ganti versi” akan menggantinya` : ''}
                </p>

                ${p.chunks.map((c, i) => `
                    <div class="chunk ${c.status === 'Aktif' ? '' : 'off'}">
                        <div class="row">
                            <b>${i + 1}. ${esc(c.title)}</b>
                            <span>
                                <span class="tag ${c.kind === 'fakta' ? '' : c.kind === 'instruksi' ? 'blue' : 'gray'}">${esc(c.kind)}</span>
                                <span class="tag gray">${esc(c.category)}</span>
                            </span>
                        </div>

                        <div class="sub">
                            ${c.chars} karakter · ${esc(c.validity)} · 🔑 ${esc(c.keywords)}
                        </div>

                        <p>${esc(c.preview)}…</p>
                    </div>
                `).join('')}
            `
        );
      } catch (e) {
        toast(e.message);
      }
    }

    async function replaceDoc(id, file) {
      if (!file) return;

      const fd = new FormData();
      fd.append('files', file);
      fd.append('mode', 'replace:' + id);

      busy = true;

      try {
        const r = await req('/knowledge/upload', { method: 'POST', body: fd });
        uploadResults = r.results;

        await loadTab();
        await loadChunks(id);

        toast(
          r.results[0].action === 'error'
            ? r.results[0].error
            : 'Versi baru tersimpan.'
        );
      } catch (e) {
        toast(e.message);
      } finally {
        busy = false;
        render();
      }
    }

    async function loadChunks(id) {
      activeDoc = id;

      if (id === 0) {
        const all = (await req('/knowledge')).items;
        docChunks = all.filter(k => k.document_id === null);
      } else {
        docChunks = (await req('/knowledge/documents/' + id)).chunks;
      }
    }

    async function openDoc(id) {
      try {
        chunkFilter = { q: '', kind: '', status: '' };
        await loadChunks(id);
        render();
      } catch (e) {
        toast(e.message);
      }
    }

    function closeDoc() {
      activeDoc = null;
      docChunks = [];
      render();

    async function setDocStatus(id, status) {
      try {
        await req('/knowledge/documents/' + id, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });

        await loadTab();
        render();

        toast(
          status === 'Aktif'
            ? 'Dokumen diaktifkan.'
            : 'Dokumen dinonaktifkan; AI tidak lagi memakainya.'
        );
      } catch (e) {
        toast(e.message);
      }
    }

    async function downloadDoc(id) {
      try {
        const r = await fetch(
          API + '/api/knowledge/documents/' + id + '/download',
          { headers: { Authorization: 'Bearer ' + token } }
        );

        if (!r.ok) throw new Error('Gagal mengunduh.');

        const b = await r.blob();
        const a = document.createElement('a');

        a.href = URL.createObjectURL(b);
        a.download = (docs.find(d => d.id === id)?.filename || 'dokumen').replace(/\.[^.]+$/, '') + '.md';
        a.click();

        URL.revokeObjectURL(a.href);
      } catch (e) {
        toast(e.message);
      }
    }

    async function reindexDoc(id) {
      if (!confirm('Pecah ulang dokumen dari teks aslinya? Perubahan manual pada bagian-bagiannya akan tertimpa.')) return;

      try {
        const r = await req('/knowledge/documents/' + id + '/reindex', { method: 'POST' });
        await loadTab();
        await loadChunks(id);
        render();
        toast('Diindeks ulang: ' + r.chunks + ' bagian.');
      } catch (e) {
        toast(e.message);
      }

    async function deleteDoc(id) {
      const d = docs.find(x => x.id === id);

      if (!confirm('Hapus dokumen “' + (d?.title || id) + '” beserta semua bagiannya?')) return;

      try {
        await req('/knowledge/documents/' + id, { method: 'DELETE' });

        if (activeDoc === id) {
          activeDoc = null;
          docChunks = [];
        }

        await loadTab();
        render();
        toast('Dokumen dihapus.');
      } catch (e) {
        toast(e.message);
      }

    function editArticle(id) {
      const k = docChunks.find(x => x.id === id);
      if (!k) return;

      openDlg(
        'Edit KB-' + id,
        articleForm(k, 'e') +
        `
            <div class="actions">
                <button class="btn" onclick="saveArticle(${id})">Simpan perubahan</button>
                <button class="btn secondary" onclick="closeDlg()">Batal</button>
            </div>

    async function saveArticle(id) {
      const p = id ? 'e' : 'n';
      const body = readArticle(p);

      if (!body.title || !body.body) return toast('Judul dan isi wajib diisi.');

      try {
        await req(
          id ? '/knowledge/' + id : '/knowledge',
          {
            method: id ? 'PUT' : 'POST',
            body: JSON.stringify(body)
          }
        );

        if (id) closeDlg();

        await loadTab();

        if (!id) await loadChunks(0);

        render();
        toast(id ? 'Bagian diperbarui.' : 'Artikel tersimpan.');
      } catch (e) {
        toast(e.message);
      }
    }

    async function toggleArticle(id) {
      const k = docChunks.find(x => x.id === id);

      try {
        await req('/knowledge/' + id, {
          method: 'PUT',
          body: JSON.stringify({
            title: k.title,
            category: k.category,
            keywords: k.keywords || '',
            body: k.body,
            kind: k.kind,
            source_url: k.source_url || '',
            validity: k.validity || 'umum',
            status: k.status === 'Aktif' ? 'Draf' : 'Aktif'

        'Catatan aktivitas terbaru.'
      ) + `
        <div class="panel tablewrap">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Pengguna</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    ${auditRows.map(a => `
                        <tr>
                            <td>${esc(a.created_at)}</td>
                            <td>${esc(a.user_email)}</td>
                            <td>${esc(a.action)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>`;
    }

    (async function init() {
      if (!token) {
        render();
        return;
      }

      try {
        const d = await req('/auth/me');
        me = d.user;
        maxStrikes = d.max_strikes || 3;
        tab = me.role === 'admin' ? 'dashboard' : 'chat';

        await loadTab();
        render();
      } catch {
        token = '';
        localStorage.removeItem('vteki_token');
        render();
      }
    })();
  </script>
</body>

</html>
