    <div class="formrow"><label>Sifat Informasi</label><select id="${p}kind" class="field">${[['fakta', 'Fakta — Rujukan Jawaban'], ['instruksi', 'Panduan Kebijakan Penanganan'], ['metadata', 'Metadata Internal']].map(([v, l]) => `<option value="${v}" ${v === (k.kind || 'fakta') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="formrow"><label>Status Terbitan</label><select id="${p}status" class="field">${['Aktif', 'Draf'].map(s => `<option ${s === (k.status || 'Aktif') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    <div class="formrow"><label>Masa Berlaku</label><select id="${p}validity" class="field">${[['umum', 'Umum'], ['dinamis', 'Dinamis (Limit/Biaya/Ketentuan Berkala)']].map(([v, l]) => `<option value="${v}" ${v === (k.validity || 'umum') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  </div>
  <div class="formrow"><label>Tautan Dokumen Sumber Resmi</label><input id="${p}src" class="field" value="${esc(k.source_url || '')}" placeholder="https://…"></div>
  <div class="formrow"><label>Kata Kunci Pencarian (Pisahkan dengan Spasi)</label><input id="${p}kw" class="field" value="${esc(k.keywords || '')}"></div>
  <div class="formrow"><label>Konten Informasi Lengkap</label><textarea id="${p}body" class="field" style="min-height:160px;" maxlength="20000">${esc(k.body || '')}</textarea></div>`;
    }

    function readArticle(p) {
      return {
        title: $('#' + p + 'title').value.trim(),
        category: $('#' + p + 'cat').value,
        kind: $('#' + p + 'kind').value,
        status: $('#' + p + 'status').value,
        validity: $('#' + p + 'validity').value,
        source_url: $('#' + p + 'src').value.trim(),
        keywords: $('#' + p + 'kw').value.trim(),
        body: $('#' + p + 'body').value.trim()
      };
    }

    function bindDrop() {
      const d = $('#drop');
      if (!d) return;
      ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
      d.addEventListener('drop', e => pickFiles(e.dataTransfer.files));
    }

    function pickFiles(list) {
      const ok = /\.(md|markdown|txt|pdf|docx)$/i;
      for (const f of list) {
        if (!ok.test(f.name)) { toast('Format berkas ' + f.name + ' tidak didukung.'); continue; }
        if (!pendingFiles.some(x => x.name === f.name && x.size === f.size)) pendingFiles.push(f);
      }
      uploadResults = [];
      render();
    }

    function removeFile(i) {
      pendingFiles.splice(i, 1);
      render();
    }

    async function uploadFiles() {
      if (!pendingFiles.length) return;
      const fd = new FormData();
      pendingFiles.forEach(f => fd.append('files', f));
      fd.append('status', $('#upstatus').value);
      fd.append('mode', $('#upmode').value);
      fd.append('category', $('#upcat').value);
      busy = true;
      render();
      try {
        const r = await req('/knowledge/upload', { method: 'POST', body: fd });
        uploadResults = r.results;
        pendingFiles = [];
        const okDoc = r.results.find(x => x.document_id);
        const d = await req('/knowledge/documents');
        docs = d.items;
        manualCount = d.manual_articles;
        if (okDoc) await loadChunks(okDoc.document_id);
        toast('Dokumen berhasil diunggah dan diindeks.');
      } catch (e) {
        toast(e.message);
      } finally {
        busy = false;
        render();
      }
    }

    async function previewFile() {
      const fd = new FormData();
      fd.append('file', pendingFiles[0]);
      try {
        const p = await req('/knowledge/preview', { method: 'POST', body: fd });
        openDlg('Pratinjau Struktur: ' + p.title, `
      <p class="sub">${p.chunks.length} klausul terurai &middot; Tipe format: ${esc(p.file_type)}${p.checked_at ? ' &middot; Tanggal rujukan: ' + esc(p.checked_at) : ''}${p.existing ? ` &middot; <b>Nama berkas identik dengan KD-${p.existing.id} (v${p.existing.version})</b>` : ''}</p>
      ${p.chunks.map((c, i) => `
        <div class="chunk ${c.status === 'Aktif' ? '' : 'off'}">
          <div class="row">
            <b>${i + 1}. ${esc(c.title)}</b>
            <span><span class="tag ${c.kind === 'fakta' ? '' : c.kind === 'instruksi' ? 'blue' : 'gray'}">${esc(c.kind)}</span><span class="tag gray">${esc(c.category)}</span></span>
          </div>
          <div class="sub">${c.chars} karakter &middot; Kata Kunci: ${esc(c.keywords)}</div>
          <p>${esc(c.preview)}…</p>
        </div>`).join('')}
    `);
      } catch (e) { toast(e.message); }
    }

    async function replaceDoc(id, file) {
      if (!file) return;
      const fd = new FormData();
      fd.append('files', file);
      fd.append('mode', 'replace:' + id);
      busy = true;
      try {
        const r = await req('/knowledge/upload', { method: 'POST', body: fd });
        uploadResults = r.results;
        await loadTab();
        await loadChunks(id);
        toast(r.results[0].action === 'error' ? r.results[0].error : 'Versi dokumen berhasil diperbarui.');
      } catch (e) { toast(e.message); } finally { busy = false; render(); }
    }

    async function loadChunks(id) {
      activeDoc = id;
      if (id === 0) {
        const all = (await req('/knowledge')).items;
        docChunks = all.filter(k => k.document_id === null);
      } else {
        docChunks = (await req('/knowledge/documents/' + id)).chunks;
      }
    }

    async function openDoc(id) {
      try {
        chunkFilter = { q: '', kind: '', status: '' };
        await loadChunks(id);
        render();
      } catch (e) { toast(e.message); }
    }

    function closeDoc() {
      activeDoc = null;
      docChunks = [];
      render();
    }

    async function setDocStatus(id, status) {
      try {
        await req('/knowledge/documents/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
        await loadTab(); render();
        toast(status === 'Aktif' ? 'Dokumen diaktifkan sebagai rujukan.' : 'Dokumen dinonaktifkan dari rujukan operasional.');
      } catch (e) { toast(e.message); }
    }

    async function setDocOrg(id) {
      const d = docs.find(x => x.id === id);
      const v = prompt('Entitas organisasi dokumen ini (contoh: "Bank BCA"):', d?.org_name || '');
      if (v === null) return;
      try {
        await req('/knowledge/documents/' + id, { method: 'PATCH', body: JSON.stringify({ org_name: v.trim() }) });
        await loadTab(); render();
        toast('Organisasi tersimpan.');
      } catch (e) { toast(e.message); }
    }

    async function downloadDoc(id) {
      try {
        const r = await fetch(API + '/api/knowledge/documents/' + id + '/download', { headers: { Authorization: 'Bearer ' + token } });
        if (!r.ok) throw new Error('Gagal mengunduh.');
        const b = await r.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = (docs.find(d => d.id === id)?.filename || 'dokumen').replace(/\.[^.]+$/, '') + '.md';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { toast(e.message); }
    }

    async function reindexDoc(id) {
      if (!confirm('Indeks ulang seluruh klausul dari teks asli dokumen?')) return;
      try {
        const r = await req('/knowledge/documents/' + id + '/reindex', { method: 'POST' });
        await loadTab();
        await loadChunks(id);
        render();
        toast('Selesai diindeks ulang: ' + r.chunks + ' klausul.');
      } catch (e) { toast(e.message); }
    }

    async function deleteDoc(id) {
      const d = docs.find(x => x.id === id);
      if (!confirm('Hapus dokumen "' + (d?.title || id) + '" beserta seluruh klausul terkait?')) return;
      try {
        await req('/knowledge/documents/' + id, { method: 'DELETE' });
        if (activeDoc === id) { activeDoc = null; docChunks = []; }
        await loadTab(); render();
        toast('Dokumen berhasil dihapus.');
      } catch (e) { toast(e.message); }
    }

    function editArticle(id) {
      const k = docChunks.find(x => x.id === id);
      if (!k) return;
      openDlg('Perbarui Klausul KB-' + id, articleForm(k, 'e') + `<div class="actions"><button class="btn" onclick="saveArticle(${id})">Simpan Perubahan</button><button class="btn secondary" onclick="closeDlg()">Batal</button></div>`);
    }

    async function saveArticle(id) {
      const p = id ? 'e' : 'n';
      const body = readArticle(p);
      if (!body.title || !body.body) return toast('Judul dan isi klausul wajib dilengkapi.');
      try {
        await req(id ? '/knowledge/' + id : '/knowledge', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
        if (id) closeDlg();
        await loadTab();
        if (!id) await loadChunks(0);
        render();
        toast(id ? 'Klausul berhasil diperbarui.' : 'Klausul baru berhasil disimpan.');
      } catch (e) { toast(e.message); }
    }

    async function toggleArticle(id) {
      const k = docChunks.find(x => x.id === id);
      try {
        await req('/knowledge/' + id, {
          method: 'PUT',
          body: JSON.stringify({
            title: k.title, category: k.category, keywords: k.keywords || '', body: k.body,
            kind: k.kind, source_url: k.source_url || '', validity: k.validity || 'umum',
            status: k.status === 'Aktif' ? 'Draf' : 'Aktif'
          })
        });
        await loadTab(); render();
      } catch (e) { toast(e.message); }
    }

    async function deleteArticle(id) {
      if (!confirm('Hapus klausul KB-' + id + '?')) return;
      try {
        await req('/knowledge/' + id, { method: 'DELETE' });
        await loadTab(); render();
        toast('Klausul telah dihapus.');
      } catch (e) { toast(e.message); }
    }

    async function searchTest(e) {
      e.preventDefault();
      const q = $('#sq').value.trim();
      if (!q) return;
      try {
        searchResult = await req('/knowledge/search-test', { method: 'POST', body: JSON.stringify({ query: q }) });
        render();
      } catch (err) { toast(err.message); }
    }

    /* ---------------- Pusat Pengawasan Kepatuhan & Mitigasi Risiko ---------------- */
    function guardrailView() {
      const stageTag = {
        input: '<span class="tag red">Pola Anomali</span>',
        llm: '<span class="tag red">Analisis Semantik</span>',
        output: '<span class="tag warn">Respons Tertahan</span>',
        sensitive: '<span class="tag blue">Penyaringan Data Rahasia</span>'
      };
      const users = guard.users.length ? guard.users.map(u => `
    <div class="listitem">
      <div class="row">
        <b>${esc(u.name)}</b>
        <span>${u.ai_suspended ? '<span class="tag red">Akses Dibatasi</span>' : ''}<span class="tag warn">Peringatan: ${u.guardrail_strikes}/${guard.max_strikes}</span></span>
      </div>
      <div class="sub">${esc(u.email)}</div>
      <div class="actions" style="margin-top:6px;">${btn('Pulihkan Akses & Reset Peringatan', `restoreAI(${u.id})`, 'btn secondary small')}</div>
    </div>
  `).join('') : '<div class="empty">Tidak ada akun nasabah dalam status pembatasan kepatuhan.</div>';

      const rows = guard.items.map(g => `
    <tr>
      <td class="sub">${esc(g.created_at)}</td>
      <td>${esc(g.customer_name || '-')}<div class="sub">${esc(g.customer_email || '')}</div></td>
      <td>${g.case_id ? `<a href="#" onclick="openCase('${esc(g.case_id)}');return false" style="color:var(--accent);font-weight:600;">${esc(g.case_id)}</a>` : '-'}</td>
      <td>${stageTag[g.stage] || esc(g.stage)}<div class="sub">${esc((g.reason_labels || []).join(', '))}</div></td>
      <td style="min-width:220px;max-width:340px;white-space:pre-wrap;overflow-wrap:anywhere;">${esc(g.message.slice(0, 300))}</td>
      <td class="sub">${esc(g.action)}</td>
      <td>${g.reviewed ? `<span class="tag ${g.verdict === 'false_positive' ? 'gray' : g.verdict === 'info' ? 'blue' : 'green'}">${g.verdict === 'false_positive' ? 'Salah Deteksi' : g.verdict === 'info' ? 'Info' : 'Dikonfirmasi'}</span><div class="sub">${esc(g.reviewed_by || '')}</div>` : `<div class="actions">${btn('Konfirmasi', `reviewEvent(${g.id},'confirmed')`, 'btn small')}${['input', 'llm'].includes(g.stage) ? btn('Salah Deteksi', `reviewEvent(${g.id},'false_positive')`, 'btn secondary small') : ''}</div>`}</td>
    </tr>
  `).join('');

      return pagehead('Pusat Pengawasan Kepatuhan & Mitigasi Risiko', 'Audit proaktif interaksi mencurigakan, pencegahan kebocoran data, dan penegakan batasan kepatuhan nasabah.') +
        `<div class="grid2">
    <div class="panel">
      <h3 class="sectiontitle">Profil dalam Pengawasan Khusus</h3>
      ${users}
      <hr class="sep">
      <h3 class="sectiontitle">Mekanisme Pengamanan Berlapis</h3>
      <ol class="muted" style="padding-left:18px;margin:0;line-height:1.7;">
        <li>Normalisasi karakter dan filter pola manipulasi injeksi teks.</li>
        <li>Klasifikasi intents dan verifikasi integritas peran interaksi.</li>
        <li>Otomatisasi penguncian tiket dan penerusan langsung ke petugas saat anomali terdeteksi.</li>
        <li>Validasi keluaran: menyaring penyebutan data tidak terverifikasi atau permintaan data otentikasi terlarang.</li>
      </ol>
    </div>
    <div class="panel tablewrap" style="margin-top:0;">
      <h3 class="sectiontitle">Log Kejadian Kepatuhan (${guard.items.length})</h3>
      ${guard.items.length ? `<table><thead><tr><th>Waktu</th><th>Nasabah</th><th>Kasus</th><th>Tipe Pengecekan</th><th>Isi Pesan</th><th>Tindakan Sistem</th><th>Tinjauan Pengawas</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Tidak ada kejadian pelanggaran yang tercatat.</div>'}
    </div>
  </div>`;
    }

    async function reviewEvent(id, verdict) {
      if (verdict === 'false_positive' && !confirm('Konfirmasi sebagai salah deteksi? Peringatan nasabah akan disesuaikan dan layanan tiket dibuka kembali.')) return;
      try {
        await req('/admin/guardrail/' + id + '/review', { method: 'POST', body: JSON.stringify({ verdict }) });
        await loadTab(); render();
        toast('Tinjauan pengawas berhasil disimpan.');
      } catch (e) { toast(e.message); }
    }

    async function restoreAI(uid) {
      if (!confirm('Pulihkan akses penuh dan reset akumulasi peringatan untuk pengguna ini?')) return;
      try {
        await req('/admin/users/' + uid + '/restore-ai', { method: 'POST' });
        await loadTab(); render();
        toast('Akses berhasil dipulihkan.');
      } catch (e) { toast(e.message); }
    }

    async function openCase(id) {
      activeCase = id;
      await go('cases');
    }

    /* ---------------- Pemberitahuan & Otorisasi ---------------- */
    function notificationsView() {
      return pagehead('Pemberitahuan Sistem', 'Pembaruan tiket, pengalihan eskalasi, dan tindak lanjut tugas.') +
        `<div class="panel">
    ${btn('Tandai Semua Sudah Dibaca', 'readAll()', 'btn secondary')}
    <div style="margin-top:10px;"></div>
    ${notifications.map(n => `
      <div class="listitem ${n.case_id ? 'clickable' : ''}" ${n.case_id ? `onclick="${me.role === 'admin' ? `openCase('${esc(n.case_id)}')` : `activeCase='${esc(n.case_id)}';go('chat')`}"` : ''}>
        <div class="row">
          <b>${esc(n.message)}</b>
          <span class="tag ${n.is_read ? 'gray' : 'warn'}">${n.is_read ? 'Sudah Dibaca' : 'Baru'}</span>
        </div>
        <div class="sub">${esc(n.case_id || '')} &middot; ${esc(n.created_at)}</div>
      </div>
    `).join('') || '<div class="empty">Tidak ada notifikasi baru.</div>'}
  </div>`;
    }

    async function readAll() {
      try {
        await req('/notifications/read-all', { method: 'POST' });
        notifications = (await req('/notifications')).items;
        if (dashboard) dashboard.unread_notifications = 0;
        render();
      } catch (e) { toast(e.message); }
    }

    function approvalsView() {
      return pagehead('Persetujuan Otorisasi Khusus', 'Otorisasi tindakan operasional perbankan berisiko tinggi oleh supervisor berwenang.') +
        `<div class="panel">
    ${approvals.map(a => `
      <div class="listitem">
        <div class="row">
          <b>${esc(a.id)} &middot; ${esc(a.customer_name || a.customer_email)}</b>
          <span class="tag red">Menunggu Otorisasi Supervisor</span>
        </div>
        <div style="margin:6px 0;">${a.verified_level >= 3 ? '<span class="tag blue">Terverifikasi Otorisasi Penuh (AL3)</span>' : `<span class="tag warn">Belum Memenuhi AL3 (Tingkat Saat Ini: AL${a.verified_level || 1})</span>`}</div>
        <p style="margin:6px 0;">${esc(a.last_message || a.subject)}</p>
        ${a.verified_level >= 3 ? '' : '<p class="sub">Otorisasi terkunci hingga nasabah menyelesaikan verifikasi identitas AL3 (OTP dan PIN Transaksi). Supervisor tetap berhak menolak permohonan.</p>'}
        <div class="actions">
          ${a.verified_level >= 3 ? btn('Setujui Permohonan', `decide('${esc(a.id)}',true)`, 'btn') : '<button class="btn" disabled title="Tingkat verifikasi nasabah belum memenuhi syarat">Setujui Permohonan</button>'}
          ${btn('Tolak', `decide('${esc(a.id)}',false)`, 'btn danger')}
          ${btn('Buka Detail Kasus', `openCase('${esc(a.id)}')`, 'btn secondary')}
        </div>
      </div>
    `).join('') || '<div class="empty">Tidak ada permohonan yang membutuhkan persetujuan saat ini.</div>'}
  </div>`;
    }

    async function decide(id, approve) {
      if (!confirm((approve ? 'Setujui' : 'Tolak') + ' permohonan tindakan kasus ' + id + '?')) return;
      try {
        await req('/admin/approvals/' + id, { method: 'POST', body: JSON.stringify({ approve }) });
        approvals = (await req('/admin/approvals')).items;
        toast('Keputusan otorisasi telah tersimpan.');
        render();
      } catch (e) { toast(e.message); }
    }

    function auditView() {
      return pagehead('Audit Trail Kepatuhan Sistem', 'Catatan aktivitas dan jejak perubahan sistem secara berurutan.') +
        `<div class="panel tablewrap">
    <table>
      <thead><tr><th>Waktu (WIB)</th><th>Pengguna / Petugas</th><th>Deskripsi Tindakan</th></tr></thead>
      <tbody>
        ${auditRows.map(a => `<tr><td class="sub">${esc(a.created_at)}</td><td>${esc(a.user_email)}</td><td>${esc(a.action)}</td></tr>`).join('')}
      </tbody>
    </table>
  </div>`;
    }

    (async function init() {
      if (!token) { render(); return; }
      try {
        const d = await req('/auth/me');
        me = d.user;
        maxStrikes = d.max_strikes || 3;
        auth = d.auth || null;
        window._org = d.org;
        tab = me.role === 'admin' ? 'dashboard' : 'chat';
        await loadTab();
        render();
      } catch {
        token = '';
        localStorage.removeItem('vteki_token');
        render();
      }
    })();
  </script>
  <script src="ops.js"></script>
</body>

</html>
